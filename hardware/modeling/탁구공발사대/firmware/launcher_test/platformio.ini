; 탁구공 발사대 시험 펌웨어(단독) — ESP32-S3 N16R8 (DevKitC-1 꼴).
;   pio run -t upload       올리기 (USB-C 아무 포트나)
;   pio device monitor      시리얼 115200 — 명령은 src/main.cpp 머리말
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1
