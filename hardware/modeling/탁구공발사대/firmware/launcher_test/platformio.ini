; 탁구공 발사대 시험 펌웨어(단독) — ESP32-S3 N16R8 (DevKitC-1 꼴) 또는 ESP32-C3 SuperMini.
;   pio run -e esp32s3 -t upload   올리기 (USB-C 아무 포트나) · C3 는 -e esp32c3
;   pio device monitor      시리얼 115200 — 명령은 src/main.cpp 머리말
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1

; ESP32-C3 SuperMini: 왼쪽 줄만 — 레버 GPIO 4, 각도 GPIO 3
[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1 -DARDUINO_USB_MODE=1 -DLAUNCHER_TILT_PIN=3
