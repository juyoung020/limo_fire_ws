; LIMO 화재 대응 ESP32 펌웨어 (PlatformIO). 지금은 초음파 HC-SR04 × 3 만 — 레이더·열화상·서보·펌프는 같은 시리얼 형식(README)에 줄 종류를 더한다
;   pio run                 빌드
;   pio run -t upload       올리기 (USB)
;   pio device monitor      시리얼 보기 (115200)
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -Wall -Wextra
