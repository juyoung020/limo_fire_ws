; LIMO 화재 대응 ESP32 펌웨어 (PlatformIO, ESP32-S3 개발 보드 — docs/wiring.md). 초음파 HC-SR04 × 2 · 열화상 · 레이더 — 서보·펌프는 같은 시리얼 형식(README)에 줄 종류를 더한다
;   pio run                 빌드
;   pio run -t upload       올리기 (USB)
;   pio device monitor      시리얼 보기 (921600)
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 921600
build_flags = -Wall -Wextra

; ESP32-C3 SuperMini (핀은 include/config.h 의 C3 칸, 잠정). USB 시리얼은 칩 안의 USB-CDC 라 부팅 때부터 켠다
[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 921600
build_flags = -Wall -Wextra -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
