; LIMO 화재 대응 ESP32 펌웨어 (PlatformIO, ESP32-S3 개발 보드 — docs/wiring.md). 지금은 초음파 HC-SR04 × 2 만 — 레이더·열화상·서보·펌프는 같은 시리얼 형식(README)에 줄 종류를 더한다
;   pio run                 빌드
;   pio run -t upload       올리기 (USB)
;   pio device monitor      시리얼 보기 (115200)
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags = -Wall -Wextra
