; 열화상 GY-MCU90640 단독 확인 (Arduino Uno) — firmware/sensor_check/thermal_gymcu90640 (ESP32-S3) 와 같은 줄을 낸다.
;   pio run -e uno          빌드
;   pio run -e uno -t upload  올리기 (USB. 모듈 TX 가 0 번 핀이라 올릴 때 그 선을 뽑는다)
; 프레임 조립·체크섬은 로봇 펌웨어와 같은 코드(../../limo_fire_esp32/include/sensor_frames.h)를 쓴다 — 호스트 시험은 그쪽 test/ 에 있다.
[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
; Uno SRAM 2 KB: 프레임 1544 B 를 받아야 해서 보내기 버퍼를 16 B 로 줄인다. 받기 버퍼 64 B(기본)는 한 장 받는 동안 loop 가 비우므로 충분
build_flags = -std=gnu++17 -Wall -Wextra -I../../limo_fire_esp32/include -DSERIAL_RX_BUFFER_SIZE=64 -DSERIAL_TX_BUFFER_SIZE=16
