; 초음파 HC-SR04 × 2 단독 확인 (Arduino Uno) — 로봇 펌웨어(limo_fire_esp32)와 같은 $US·$HB 줄을 낸다.
;   pio run -e uno            빌드
;   pio run -e uno -t upload  올리기 (USB)
; Uno 는 5 V 보드라 Echo 를 저항 없이 바로 꽂는다. 줄 만들기는 로봇 펌웨어와 같은 코드(../../limo_fire_esp32/include/protocol.h)
[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Wall -Wextra -I../../limo_fire_esp32/include
