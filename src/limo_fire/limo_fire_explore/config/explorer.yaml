# 합친 탐사 실물 노드 (src/explorer_node.cpp — 위층 판단 모델 + 아래층 A* 경로 추종). 관측·결정 주기·판 끝은 시뮬 설정
# (train/explore/sim/config/env.yaml)을 그대로 읽는다 — 여기에는 ROS 쪽과 위층·닿음 값만
# 지시 글 → 클래스 별칭: 이름공간 explore 의 모든 노드 (explorer · 저장 지도 object_goto — navigation.launch.xml 도 이 파일을 읽음)
/explore/**:
  ros__parameters:
    # 한글 이름 = 물체 지도 클래스 이름 (COCO 80 종 · 화재 7 종). 영문 클래스 이름은 그대로 써도 된다
    aliases: ["사람=person", "의자=chair", "소파=couch", "침대=bed", "식탁=dining_table", "책상=dining_table", "변기=toilet",
              "티비=tv", "TV=tv", "노트북=laptop", "마우스=mouse", "리모컨=remote", "키보드=keyboard", "휴대폰=cell_phone", "핸드폰=cell_phone",
              "전자레인지=microwave", "오븐=oven", "토스터=toaster", "싱크대=sink", "냉장고=refrigerator", "책=book", "시계=clock",
              "꽃병=vase", "가위=scissors", "곰인형=teddy_bear", "칫솔=toothbrush", "병=bottle", "컵=cup", "그릇=bowl", "숟가락=spoon",
              "포크=fork", "칼=knife", "가방=backpack", "배낭=backpack", "핸드백=handbag", "우산=umbrella", "여행가방=suitcase", "캐리어=suitcase",
              "화분=potted_plant", "자전거=bicycle", "공=sports_ball", "바나나=banana", "사과=apple", "오렌지=orange",
              "불=fire", "연기=smoke", "소화기=fire_extinguisher", "비상구=exit_sign", "유도등=exit_sign", "문=door", "계단=stairs"]

/explore/explorer:          # 노드 /explore/explorer (app.launch.xml 이 컨테이너 /app 에 이름공간 explore 로 올림)
  ros__parameters:
    debug: false              # true: RViz 표시 토픽(candidates · candidates_text · decider_image · goal_marker)과 cmd_debug 도 냄 (app.launch.xml 은 rviz:=true 면 켬)
    dry_run: true             # true: /cmd_vel 발행자를 안 만들고 명령을 /explore/cmd_debug 에만. 실제 주행은 false (README 점검표 뒤)
    enabled: false            # 늘 꺼진 채 뜸 → /explore/enable true (RViz 탐사 패널 "/explore") — 리모컨 오토일 때만 켜짐
    decider_url: http://127.0.0.1:8171   # 위층 판단 모델 — 로봇 안 llama-server (POST /v1/systemone, README)
    decider_max_cands: 6      # 요청에 넣는 후보 수 상한 (0 = 다) — 시뮬 위층 비교에서 6 이 가장 빠름 (upper_lora/README), 라벨 굴리기(dec_rollout)와 같은 값
    decider_hold_extra: 5     # 걸음 — 목표가 죽었는데 답이 오는 중이면 (걸음으로 잰 답 지연 + 이것)까지 기다림, 규칙이 대신 안 고름 (−1 = 바로 대신)
    decider_ask_lead_s: 1.0   # s — event: 남은 길 / 0.98 m/s ≤ 답 지연 + 이것 이면 미리 물음 (닿기 전에 답, −1 = 끔 — 남은 1 m 만)
    decider_obj_max: 3        # 지시가 있을 때 물체 후보 칸 (지도 물체 모든 클래스 + 지금 보이는 사람 따라가기, 힌트 클래스 먼저 · 많으면 가깝고 먼 것 고르게) — 프론티어는 남은 칸
    decider_obj_always: false # true = 지시 없어도 물체 후보 (false 면 지시 없는 탐사 요청은 예전과 바이트 같음)
    decider_vis_s: 1.0        # s — 이 안에 본 물체 = 지금 보임 (요청 vis)
    decider_obj_stale_s: 600.0  # s — 이보다 오래 안 본 물체는 물체 후보에서 뺌
    # 사람 따라가기 (scripts/obj_follow.h): 판단 모델이 지금 보이는 사람(follow_classes) 의 follow 후보를 고르면 그 사람을 따라감 — 목표는 사람에서 follow_dist 떨어진 로봇 쪽 자리
    follow_classes: ["person"]
    follow_dist: 1.0          # m — 사람과 둘 거리
    follow_stop: 0.7          # m — 이보다 가까우면 앞으로 안 몲 (사람 쪽으로 돌아 섬). 충돌 감시는 그대로 켜 있음
    follow_hyst: 0.3          # m — 목표 바꿈 문턱 · 섬↔몲 띠 (목표가 안 떨리게)
    follow_replan_s: 0.3      # s — 목표 다시 셈 간격 (약 3 Hz)
    follow_gate: 0.8          # m — 같은 사람 문 (예측 자리 둘레, 못 본 시간 × follow_gate_v 만큼 넓힘, 3 m 까지)
    follow_gate_v: 1.2        # m/s — 사람 걸음 상한 (잠정)
    follow_lost_s: 1.5        # s — 이만큼 못 보면 놓침: 마지막 자리 앞까지 간 뒤 가던 쪽으로 천천히 돎
    follow_search_s: 12.0     # s — 놓친 뒤 이만큼 못 찾으면 멈추고 "놓침" 알림
    follow_search_w: 0.5      # rad/s — 찾기 제자리 회전
    follow_max_speed: 0.6     # m/s — 따라가는 동안 속도 한도
    follow_reask_m: 1.5       # m — 고른 뒤 사람이 이만큼 옮기면 판단 모델에 다시 물음 (계속 따라갈지)
    follow_clear: 0.25        # m — 설 자리 둘레 빈 칸 반경
    # 지시 일 감독 (scripts/task_sup.h): 물체로 가기 · 바라보기 · 못 가면 실패 · 지시 시간 한도 (뒤로 물러나지 않음)
    goto_stall_s: 10.0        # s — 이 동안 설 자리에 goto_stall_m 더 못 다가가면 못 감
    goto_stall_m: 0.3
    goto_nopath_s: 3.0        # s — 경로 없음이 이만큼 이어지면 못 감
    goto_max_fail: 3          # 한 지시에서 못 감이 이만큼이면 멈추고 "못 감"
    goto_fail_ttl_s: 120.0    # s — 못 간 물체(같은 번호 · 같은 클래스 0.5 m 안)를 후보에서 빼는 시간
    instruction_limit_s: 300.0  # s — 지시 하나를 이만큼 못 끝내면 멈추고 "못 찾음" (0 = 끔)
    decider_timeout: 8.0      # s, 이보다 늦은 답은 버림 (지금 목표 그대로)
    decider_px: 288           # 지도 사진 한 변 — 그림 약 81 토큰
    decider_compact: true     # 짧은 꼴(짧은 키 · 힌트를 후보 앞 · 최근 목표 목록 뺌): 로봇 Orin 요청 약 2 s (긴 꼴 + 카메라는 약 5.6 s) — 미세조정 v1 이 이 꼴로 학습됨
    decider_fmt: 1            # 요청 꼴: 1 = state JSON 객체 (미세조정 v1 꼴) · 2 = state 글 하나 (바뀌지 않는 글·지시를 앞에, 후보 한 줄씩 — 토큰이 적고 지시가 같은 동안 앞부분이 서버 캐시에)
    decider_stop_cand: false  # true = 지시가 있을 때 멈춤 후보(kind stop)를 끝에 — 판단 모델이 고르면 따라가기·물체로 가기를 끝내고 멈춤(꺼짐)
    decider_match_r: 1.5      # m, 답의 후보 칸 → 지금 후보 (기다리는 동안 후보 칸이 옮겨감 — 0.5 면 답의 절반쯤 버림)
    decider_hint: true        # 글의 "Rules of thumb" (가까운 쪽으로 쏠리게 함 — 평가에서 빼고도 잼)
    decider_mem_image: true   # 지도 사진에 지나온 길(60 s, 보라 — 옅을수록 오래됨) · 지난 목표(✓ 닿음 · × 실패 · 회색 고리 바꿈 · 파란 고리 지금)
    decider_image: A          # A = 지금 지도 한 장 · B = 한 사진을 2 × 2 칸으로 (지금 · 5 · 15 · 30 s 전, 같은 범위 · 토큰 수 같음)
    decider_log_k: 4          # 결정 기록: 최근 K 결정(언제 · 고른 후보의 지금 글자 · 이어 감/바꿈 · 결과)을 글로, 그 목표 자리를 지도에 번호(1 = 최근)로 — 0 = 끔
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    odom_topic: /odom
    imu_topic: /imu
    depth_topic: /camera/depth/image_raw
    depth_info_topic: /camera/depth/camera_info
    cmd_vel_topic: /cmd_vel
    rc_topic: /rc_state       # sensor_msgs/Joy — buttons[1] = SWB (2 = 위 = 오토). 녹화 1103_M_drive3(리모컨 주행) 1 · 1104_M_cmd_mix(ROS 명령) 2
    rc_button: 1
    rc_auto_value: 2
    rc_timeout: 0.5           # s, /rc_state 가 이만큼 안 오면 오토 아님으로 (멈추고 꺼짐)
    rc_resubscribe_s: 2.0     # s, /rc_state 발행자가 있는데 이만큼 못 받으면 구독을 새로 만듦 (구독은 best effort — RELIABLE 발행자와도 맞음, include/limo_fire_explore/rc_watch.h)
    require_rc: true          # false 는 시뮬·녹화에 /rc_state 가 없을 때만
    input_timeout: 0.3        # s, 라이다·TF·오도메트리 가 이만큼 없으면 명령 0 (돌아오면 이어 감)
    tf_timeout: 0.2           # s, 장 시각의 map → base_link 기다림 (막지 않음 — 장을 줄에 두고 5 ms 마다 다시 봄) — 잠정
    depth_timeout: 0.5        # s, 이보다 오래된 깊이 영상은 안 씀 (구멍 0) — 잠정
    camera_layer: true        # 깊이 카메라 장애물 층 (학습과 같음)
    contact_resume_s: 0.0     # > 0 이면 닿음으로 멈춘 뒤 이 시간 뒤 저절로 다시 켬 (0 = /explore/enable true 를 따로)
    max_speed: -1.0           # m/s, 음수 = 시뮬 한도 그대로 (자르지 않음)
    # 닿음 정의 (SIM_CON_MASK 71 = 라이다 1 · 깊이 2 · 멈춤 4 · 가속 64, SIM_CON_STALL 2, SIM_CON_ACC 15 m/s²) — 그만둔 아래층 RL 학습(low_w3)에서 정한 값 그대로
    con_mask: 71
    con_stall: 2
    con_acc: 15.0
    record: ""                # 비우지 않으면 입력·명령 녹화 (꼴은 train/explore/sim/tools/low_node_rec.h — low_explore_replay · node_stats 로 다시 돌림)
