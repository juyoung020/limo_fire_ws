# 합친 탐사 실물 노드 (src/low_rl_node.cpp — 위층 판단 모델 · fuel · slot0 + 아래층 A* 경로 추종). 관측·결정 주기·판 끝은 시뮬 설정
# (train/explore/sim/config/env.yaml)을 그대로 읽는다 — 여기에는 ROS 쪽과 위층·닿음 값만
low_rl:
  ros__parameters:
    dry_run: true             # true: /cmd_vel 발행자를 안 만들고 명령을 ~/cmd_debug 에만. 실제 주행은 false (README 점검표 뒤)
    enabled: false            # 늘 꺼진 채 뜸 → ~/enable true (RViz 탐사 패널 "/low_rl") — 리모컨 오토일 때만 켜짐
    upper: decider            # decider: 로봇 안 llama-server 판단 모델 (README) · fuel: 로봇 지도에서 fuel 이 목표 (combine_run --upper fuel) · slot0: 피하지 않는 첫 후보 + stick (combine_run --upper slot0, slot_vp 면 그 덩어리 시점)
    decider_url: http://127.0.0.1:8171   # upper:=decider — llama-server (POST /v1/systemone)
    decider_period: 3.0       # s, 요청 주기 — 로봇에서 잰 답 시간(후보 8 개 약 2.6 s) + 여유. 기다리는 동안 지금 목표로 몰고, 목표가 죽으면 slot0 차례로 바로
    decider_mode: event       # event = 목표에 다가감(1 m)·목표 실패·후보 크게 바뀜·10 s 최대 간격일 때만 물음 (기본 — 시뮬 비교에서 periodic 과 같은 덮음, 요청 적음) · periodic = decider_period 마다
    decider_max_cands: 6      # 요청에 넣는 후보 수 상한 (0 = 다) — 시뮬 위층 비교에서 6 이 가장 빠름 (upper_lora/README), 라벨 굴리기(dec_rollout)와 같은 값
    decider_timeout: 8.0      # s, 이보다 늦은 답은 버림 (지금 목표 그대로)
    decider_input: both       # 지도 사진 + 후보 글 (combine_run --decider-input both). all(카메라 그림)은 시뮬 장면을 광선으로 칠한 그림이라 실물에 없음
    decider_px: 288           # 지도 사진 한 변 — 그림 약 81 토큰
    decider_compact: true     # 짧은 꼴(짧은 키 · 힌트를 후보 앞 · 최근 목표 목록 뺌): 로봇 Orin 요청 약 2 s (긴 꼴 + 카메라는 약 5.6 s) — 미세조정 v1 이 이 꼴로 학습됨
    decider_prompt: 1
    decider_match_r: 1.5      # m, 답의 후보 칸 → 지금 후보 (기다리는 동안 후보 칸이 옮겨감 — 0.5 면 답의 절반쯤 버림)
    decider_cand: true        # 판단 모델 후보 = scripts/cand_view.h (기억 필드 · 안정 번호로 답 맞춤). false = 예전 hier 8 칸
    decider_hint: true        # 글의 "Rules of thumb" (가까운 쪽으로 쏠리게 함 — 평가에서 빼고도 잼)
    decider_mem_image: true   # 지도 사진에 지나온 길(60 s, 보라 — 옅을수록 오래됨) · 지난 목표(✓ 닿음 · × 실패 · 회색 고리 바꿈 · 파란 고리 지금)
    decider_image: A          # A = 지금 지도 한 장 · B = 한 사진을 2 × 2 칸으로 (지금 · 5 · 15 · 30 s 전, 같은 범위 · 토큰 수 같음)
    decider_cam: 0            # 0 = 끔 (기본 — 미세조정 v1 은 카메라 없이 학습: 라벨 시뮬에 실물 카메라가 없음, 카메라 판은 v2). n 이면 둘째 사진: 앞 4 후보마다 그 자리를 가장 잘 본 지난 카메라 장면 2 × 2 (실물 컬러 · 정렬 깊이로 가려짐 검사, scripts/cam_memory.h) — 0 = 끔
    decider_log_k: 4          # 결정 기록: 최근 K 결정(언제 · 고른 후보의 지금 글자 · 이어 감/바꿈 · 결과)을 글로, 그 목표 자리를 지도에 번호(1 = 최근)로 — 0 = 끔
    color_topic: /camera/color/image_raw
    color_info_topic: /camera/color/camera_info
    cam_base_h: 0.147         # base_link 의 바닥 위 높이 (m) — 카메라 높이 = 이것 + tf base_link→camera_link z
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    odom_topic: /odom
    imu_topic: /imu
    depth_topic: /camera/depth/image_raw
    depth_info_topic: /camera/depth/camera_info
    cmd_vel_topic: /cmd_vel
    rc_topic: /rc_state       # sensor_msgs/Joy — buttons[1] = SWB (2 = 위 = 오토). 녹화 1103_M_drive3(리모컨 주행) 1 · 1104_M_cmd_mix(ROS 명령) 2
    rc_button: 1
    rc_auto_value: 2
    rc_timeout: 0.5           # s, /rc_state 가 이만큼 안 오면 오토 아님으로 (멈추고 꺼짐)
    require_rc: true          # false 는 시뮬·녹화에 /rc_state 가 없을 때만
    input_timeout: 0.3        # s, 라이다·TF·오도메트리 가 이만큼 없으면 명령 0 (돌아오면 이어 감)
    tf_timeout: 0.2           # s, 장 시각의 map → base_link 기다림 (막지 않음 — 장을 줄에 두고 5 ms 마다 다시 봄) — 잠정
    depth_timeout: 0.5        # s, 이보다 오래된 깊이 영상은 안 씀 (구멍 0) — 잠정
    camera_layer: true        # 깊이 카메라 장애물 층 (학습과 같음)
    obs_all: false            # true = 걸음마다 시뮬과 같은 관측 전부 (위층 관측 그림 · 계층형 후보) — 점검용. false 면 위층이 쓰는 것만 (걸음 시간 ↓)
    frontier_cache: true      # 걸음 사이 프론티어 칸 판정 기억 (바뀐 칸 둘레만 다시 — 값 같음, 걸음 시간 ↓). false = 걸음마다 처음부터
    frontier_check_every: 0   # > 0 이면 그 걸음마다 기억을 처음부터 다시 센 값과 견줌 (점검용 — 다르면 고치고 셈)
    contact_resume_s: 0.0     # > 0 이면 닿음으로 멈춘 뒤 이 시간 뒤 저절로 다시 켬 (0 = ~/enable true 를 따로)
    max_speed: -1.0           # m/s, 음수 = 시뮬 한도 그대로 (자르지 않음)
    # 닿음 정의 (SIM_CON_MASK 71 = 라이다 1 · 깊이 2 · 멈춤 4 · 가속 64, SIM_CON_STALL 2, SIM_CON_ACC 15 m/s²) — 그만둔 아래층 RL 학습(low_w3)에서 정한 값 그대로
    con_mask: 71
    con_stall: 2
    con_acc: 15.0
    # 위층 fuel — scripts/README "combine_run — 위층 fuel" 고른 조합 (시간 + 전역 + 시점, 도착 구간 맞춤 v 0.981 · ω 3.232 · t0 0.10)
    fuel_time: true
    fuel_global: true
    fuel_vp: true
    fuel_room: false
    fuel_hyst: 0.2            # 지금 목표로 시작하는 순회가 가장 좋은 순회의 1.2 배 안이면 그대로 (1116_fuel_rl_1: 0 이면 39 s 에 목표 14 번, 2.8 m 씩 뜀)
    fuel_v: 0.981
    fuel_w: 3.232
    fuel_t0: 0.10
    # 시점 자격 (FUEL 저자 설정 min_candidate_dist 0.75 · min_candidate_clearance 0.21 — scripts/fuel_upper.h Opt::vp_min · vp_clear)
    fuel_vp_min: 0.75         # 로봇에서 이 거리(m) 안 시점은 안 씀 — 통과 반경(0.5) 안 목표를 내자마자 통과하던 것
    fuel_vp_clear: 0.21       # 시점 둘레 이 거리(m) 안에 모름 칸이 없어야 (없으면 거리 문턱만으로 다시, 그래도 없으면 그 덩어리는 쉼)
    close_lidar: false        # true: 지도 닫힘(성공 끝)을 라이다 지도만으로 — 깊이 카메라 층에만 막힌 곳이 남으면 안 닫힘. 시뮬에서 아래층 규칙 + slot0 성공이 크게 떨어져 기본 끔 (scripts/README)
    slot_vp: false            # upper:=slot0 에서 후보 칸 대신 그 덩어리의 시점 (fu::slot_view) — 시뮬 시험 장면에서 slot0 보다 나빠 기본 끔 (scripts/README)
    record: ""                # 비우지 않으면 입력·명령 녹화 (꼴은 train/explore/sim/tools/low_node_rec.h — low_explore_replay · node_stats 로 다시 돌림)
