# ESP32 다리 (limo_fire_esp32_bridge). 펌웨어 firmware/limo_fire_esp32 와 맞춘다. 포트를 여는 것은 이 노드 하나뿐(센서 + 발사대)
esp32_bridge:
  ros__parameters:
    # 포트: udev 규칙으로 /dev/esp32 를 만든다(README "udev"). 없으면 1 초마다 다시 열며 알린다
    port: /dev/esp32
    baud: 921600                 # 펌웨어 config.h kBaud (열화상 줄이 길어 115200 으로는 모자람)
    heartbeat_timeout: 3.0       # s, 펌웨어 살아 있음 줄 1 s 마다
    ultrasonic:
      # 펌웨어 초음파 번호 순서 = 이 이름 순서 → /ultrasonic/<이름>, 프레임 ultrasonic_<이름>_link (URDF ultrasonic.xacro, 시뮬과 같음)
      names: ["front_left", "front_right"]   # 앞 범퍼 아래 좌우 ±20° (docs/wiring.md)
      field_of_view: 0.2618      # 15°, HC-SR04 데이터시트 감지 각
      min_range: 0.02            # 데이터시트 2 cm
      max_range: 4.0             # 데이터시트 400 cm
    thermal:
      frame_id: thermal_link     # 장착 자리는 URDF (limo_fire_description). /thermal/image = 32FC1 (°C), /thermal/max = sensor_msgs/Temperature
    radar:
      frame_id: radar_link       # /radar/targets (PoseArray, REP-103 m), /radar/velocities (m/s, LD2450 원본 부호 — 실물 확인 전)
    launcher:
      # 탁구공 발사대 레버 서보(GPIO 4). 발사대 각은 기구로 15° 고정 — 각도 명령은 없다(펌웨어 include/launcher.h)
      enabled: true              # false: 발사대 인터페이스를 만들지 않음 (ESP32-C3 처럼 발사대가 없는 판)
      firing_enabled: true       # 기본 켬(2026-11-20 사용자 결정). true 일 때만 레버 켜기·장전·발사를 받는다. 공이 날아갈 쪽이 빈 시험 공간에서만 launch 인자로 켠다
      ack_timeout_s: 3.0         # e·x 응답 기한 (펌웨어는 한 loop 안에 답함)
      action_timeout_s: 8.0      # 동작 명령 뒤 마지막 응답까지 (펌웨어 s ≈ 2.5 s: 장전 ≈ 0.23+1.0+0.47+0.3 s, 발사 ≈ 0.08+0.2+0.17 s — config.h 각·속도·버팀으로 셈)
      query_period_s: 1.0        # 쉴 때·펌웨어를 아직 모를 때 상태 질의(?) 간격 → /launcher/joint_states
      lever_joint: launcher_lever_joint   # /launcher/joint_states 이름 (URDF 에는 없는 관절 — 레버 서보 명령 각, rad)
