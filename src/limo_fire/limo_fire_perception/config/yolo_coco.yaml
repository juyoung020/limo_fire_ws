# COCO 80 종 분할 모델 (Ultralytics 공식 YOLO26s-seg) — 첫 실물 시험용 기본 (yolo.launch.xml config:=yolo_coco.yaml).
# 우리 화재 7 종 모델로 바꾸려면 config:=yolo_fire.yaml (같은 노드·같은 물체 지도, 설정만 다름). 엔진 만들기는 README "COCO 80 종 분할 엔진"
# 이름은 Ultralytics coco.yaml 순서 (띄어쓰기는 _ 로)
yolo_detector:
  ros__parameters:
    engine_path: yolo26s_seg_coco_u8_480.engine   # 파일 이름만 쓰면 설치된 models/ 에서 (src/…/limo_fire_perception/models 에 두고 빌드)
    conf_threshold: 0.40
    nms_iou: 0.5
    image_topic: /camera/color/image_raw
    publish_image: true
    class_names: [person, bicycle, car, motorcycle, airplane, bus, train, truck, boat, traffic_light, fire_hydrant, stop_sign, parking_meter, bench, bird, cat, dog, horse, sheep, cow, elephant, bear, zebra, giraffe, backpack, umbrella, handbag, tie, suitcase, frisbee, skis, snowboard, sports_ball, kite, baseball_bat, baseball_glove, skateboard, surfboard, tennis_racket, bottle, wine_glass, cup, fork, knife, spoon, bowl, banana, apple, sandwich, orange, broccoli, carrot, hot_dog, pizza, donut, cake, chair, couch, potted_plant, bed, dining_table, toilet, tv, laptop, mouse, remote, keyboard, cell_phone, microwave, oven, toaster, sink, refrigerator, book, clock, vase, scissors, teddy_bear, hair_drier, toothbrush]

object_mapper:
  ros__parameters:
    detections_topic: /yolo_detector/detections
    depth_topic: /camera/depth/image_raw
    camera_info_topic: /camera/depth/camera_info
    mask_topic: /yolo_detector/mask   # 분할 모델의 물체 번호 영상. 없으면 상자로 잰다
    map_frame: map
    min_score: 0.5       # 이보다 낮은 탐지는 지도에 안 넣음
    min_depth: 0.2       # m
    max_depth: 5.0       # m, 멀면 깊이가 부정확
    box_shrink: 0.5      # 상자 가운데 50% 만 봄 (배경 섞임 방지)
    depth_percentile: 0.3  # 그 안 깊이의 하위 30% 값 = 물체 앞면 (얇은 물체 뒤 벽 무시)
    mask_depth_percentile: 0.5  # 마스크가 있으면 물체 픽셀 깊이의 가운데 값
    max_sync_dt: 0.05    # s, 탐지와 깊이 영상 시각 차이 한도
    merge_radius: 0.8    # m, 같은 클래스가 이 안이면 같은 물체
    # merge_radii: 클래스별 병합 반경 (비우면 모두 merge_radius)
    fire_zone_radius: 1.0  # m, 불 둘레 위험 반경 표시
    label_offset: [0.0, -0.52]  # m (화면 기준 오른쪽, 위쪽), 지도 라벨을 아이콘 아래로 비켜 둠
    icon_size: 0.6       # m, 지도 아이콘 지름 (배지: icons/<클래스>.obj — COCO 80 종·화재 7 종)
    footprint_min_count: 3   # 발자국 칸: 이만큼 본 칸만 (잡음 칸 줄임)
    footprint_alpha: 0.25    # 발자국 칠 진하기 — 아이콘 밑에 옅게
    view_angle: 0.0      # rad, RViz 위에서 보기(limo_fire.rviz TopDownOrtho)의 Angle 과 같게. 아이콘·라벨을 화면 위쪽에 맞춘다
    view_margin: 0.3     # 대표 사진을 자를 때 상자 둘레 여유 (상자 크기 비율)
    select_radius: 0.6   # m, Publish Point 로 누른 곳에서 이 안의 가장 가까운 물체를 고름
    robot_frame: base_link
    min_hits: 3          # 이만큼 본 것만 지도에 올림 (잘못 탐지 한두 번은 무시)
    class_names: [person, bicycle, car, motorcycle, airplane, bus, train, truck, boat, traffic_light, fire_hydrant, stop_sign, parking_meter, bench, bird, cat, dog, horse, sheep, cow, elephant, bear, zebra, giraffe, backpack, umbrella, handbag, tie, suitcase, frisbee, skis, snowboard, sports_ball, kite, baseball_bat, baseball_glove, skateboard, surfboard, tennis_racket, bottle, wine_glass, cup, fork, knife, spoon, bowl, banana, apple, sandwich, orange, broccoli, carrot, hot_dog, pizza, donut, cake, chair, couch, potted_plant, bed, dining_table, toilet, tv, laptop, mouse, remote, keyboard, cell_phone, microwave, oven, toaster, sink, refrigerator, book, clock, vase, scissors, teddy_bear, hair_drier, toothbrush]
    # 실내 로봇에 없는 COCO 클래스는 지도에 안 올림: 1116 실험실 녹화(1116_fuel_rl_1)에서 truck·bus·airplane·car·train 이 모두 큰 가구를 잘못 본 것
    ignore_classes: [airplane, bus, train, truck, car, boat, motorcycle, traffic_light, stop_sign, parking_meter, fire_hydrant, bird, horse, sheep, cow, elephant, bear, zebra, giraffe, skis, snowboard, surfboard, kite]
    class_colors: ["#3380ff", "#55e07d", "#9731e0", "#c6b74b", "#31c3e0", "#e055a0", "#52c62b", "#5b55e0", "#e06b31", "#4bc698", "#d231e0", "#c3e055", "#2b79c6", "#e05572", "#31e040", "#7a4bc6", "#e0a631", "#55e0da", "#c62b9f", "#94e055", "#314ee0", "#c65b4b", "#31e07a", "#b855e0", "#c6c62b", "#55b7e0", "#e03179", "#5ac64b", "#4f31e0", "#e09555", "#2bc6a0", "#e055da", "#a5e031", "#4b79c6", "#e0313f", "#55e072", "#7a2bc6", "#e0c455", "#31d0e0", "#c64b98", "#6ae031", "#555ae0", "#c6532b", "#55e0a1", "#c431e0", "#b6c64b", "#3196e0", "#e0557c", "#2bc62c", "#7e55e0", "#e09831", "#4bc6b8", "#e031c2", "#9fe055", "#2b51c6", "#e05c55", "#31e06d", "#994bc6", "#e0d331", "#55c2e0", "#c62b78", "#71e055", "#4131e0", "#c67a4b", "#31e0a7", "#db55e0", "#9ec62b", "#5593e0", "#e0314c", "#4bc65c", "#7b31e0", "#e0b955", "#2bc5c6", "#e055b6", "#78e031", "#4b59c6", "#e05031", "#55e096", "#a12bc6", "#d9e055"]   # class_names 순서의 지도 색 (색상환을 황금각으로 돌려 이웃 클래스끼리 다르게) — icons/ 배지와 같은 색
    # 지도 갱신: 보여야 하는데(시야 안 · 3 m 안 · 앞이 안 가림) 20 장 이어 못 보면 뺌. 1116_fuel_rl_1 녹화 재생: 8 이면 의자 1 개가 (가끔 못 잡는 YOLO 때문에)
    # 빠지고, 20 이면 의자 5 개 모두 남고 떠난 사람 2 명만 빠짐 — 잠정 (사람·동물은 아래 dynamic_ttl)
    neg_misses: 20
    neg_max_depth: 3.0
    dynamic_classes: [person, cat, dog, bird]
    dynamic_ttl: 10.0     # s, 움직이는 클래스는 이만큼 안 보이면 뺌
    objects_file: ""      # 물체 지도 파일. 있으면 켤 때 읽음 (navigation.launch.xml 이 저장 지도 옆 <이름>_objects.txt 를 줌)

