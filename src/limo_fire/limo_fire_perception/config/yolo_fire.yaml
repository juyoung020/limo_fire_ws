# 우리 YOLO26s-seg (train/detect, 7 클래스, 탐지 + 분할). 엔진은 이 기기에서 trtexec 로 만든다 (README)
# 입력 480x640 uint8 RGB(전처리를 엔진 안에 넣음). 이전 엔진(float 640x640, yolo26s_seg_fire.engine · 상자만 내는 yolo26s_fire.engine)도 그대로 돈다
yolo_detector:
  ros__parameters:
    engine_path: /home/wego/limo_fire_ws/src/limo_fire/limo_fire_perception/models/yolo26s_seg_fire_u8_480.engine
    conf_threshold: 0.35
    nms_iou: 0.5
    image_topic: /camera/color/image_raw
    publish_image: true
    class_names: [fire, smoke, fire_extinguisher, exit_sign, person, door, stairs]

# 탐지 → 지도 위 물체 (object_mapper). 깊이는 컬러에 정렬된 영상
object_mapper:
  ros__parameters:
    detections_topic: /yolo_detector/detections
    depth_topic: /camera/depth/image_raw
    camera_info_topic: /camera/depth/camera_info
    mask_topic: /yolo_detector/mask   # 분할 모델의 물체 번호 영상. 없으면 상자로 잰다
    map_frame: map
    min_score: 0.5       # 이보다 낮은 탐지는 지도에 안 넣음
    min_depth: 0.2       # m
    max_depth: 5.0       # m, 멀면 깊이가 부정확
    box_shrink: 0.5      # 상자 가운데 50% 만 봄 (배경 섞임 방지)
    depth_percentile: 0.3  # 그 안 깊이의 하위 30% 값 = 물체 앞면 (얇은 물체 뒤 벽 무시)
    mask_depth_percentile: 0.5  # 마스크가 있으면 물체 픽셀 깊이의 가운데 값
    max_sync_dt: 0.05    # s, 탐지와 깊이 영상 시각 차이 한도
    merge_radius: 0.8    # m, 같은 클래스가 이 안이면 같은 물체
    merge_radii: [0.8, 1.2, 0.8, 0.8, 0.8, 1.0, 1.6]  # 클래스별 (class_names 순서), 계단·문은 커서 넓게
    fire_zone_radius: 1.0  # m, 불 둘레 위험 반경 표시
    label_offset: [0.0, 0.55]  # m (화면 기준 오른쪽, 위쪽), 지도 라벨을 아이콘 위로 비켜 둠
    icon_size: 0.6       # m, 지도 아이콘 지름
    view_angle: 0.0      # rad, RViz 위에서 보기(limo_fire.rviz TopDownOrtho)의 Angle 과 같게. 아이콘·라벨을 화면 위쪽에 맞춘다
    view_margin: 0.3     # 대표 사진을 자를 때 상자 둘레 여유 (상자 크기 비율)
    select_radius: 0.6   # m, Publish Point 로 누른 곳에서 이 안의 가장 가까운 물체를 고름
    robot_frame: base_link
    min_hits: 5          # 이만큼 본 것만 지도에 올림 (잘못 탐지 한두 번은 무시)
    class_names: [fire, smoke, fire_extinguisher, exit_sign, person, door, stairs]
