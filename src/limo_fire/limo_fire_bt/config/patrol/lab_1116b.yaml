  - [3.5, 0.3]
  - [4.0, 1.5]
  - [4.0, 4.0]
  - [4.2, 5.8]
  - [3.0, 6.2]
  - [1.5, 6.1]
  - [-1.0, 6.5]
  - [-2.5, 5.0]
