# 실물 방 지도 lab_1116b(limo_fire_navigation/maps) 순찰점. 지도(map) 좌표 m, 순서대로 돌고 처음으로 돌아간다(방 한 바퀴 약 27 m).
# 고른 기준: 점은 지도 장애물(검은 칸)에서 0.5 m 넘게, 이웃 점 사이 직선도 대부분 0.4 m 넘게(실제 길은 Nav2 가 짠다).
# 의자·책상은 옮겨질 수 있으니 시작 전에 RViz 에서 점 둘레가 비었는지 본다. (0, 0) = 지도를 만들기 시작한 자리(방 아래쪽 가운데)
patrol:
