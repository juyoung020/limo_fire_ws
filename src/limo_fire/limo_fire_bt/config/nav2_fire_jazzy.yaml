# nav2_sim.yaml 위에 적용. 실물 launch 에서 사용하지 않는다.
global_costmap:
  global_costmap:
    ros__parameters:
      plugins: [static_layer, obstacle_layer, fire_layer, inflation_layer]
      fire_layer:
        plugin: limo_fire_bt::DangerLayer
        topic: /fire/danger_zones
        ack_topic: /fire/global_applied
local_costmap:
  local_costmap:
    ros__parameters:
      plugins: [obstacle_layer, fire_layer, inflation_layer]
      fire_layer:
        plugin: limo_fire_bt::DangerLayer
        topic: /fire/danger_zones
        ack_topic: /fire/local_applied
planner_server:
  ros__parameters:
    GridBased:
      plugin: nav2_smac_planner::SmacPlanner2D
bt_navigator:
  ros__parameters:
    default_nav_to_pose_bt_xml: /opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml
    default_nav_through_poses_bt_xml: /opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml
behavior_server:
  ros__parameters:
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    wait:
      plugin: nav2_behaviors::Wait
controller_server:
  # Independent arrival criterion remains 0.30m.
  ros__parameters:
    general_goal_checker:
      xy_goal_tolerance: 0.10
    enable_stamped_cmd_vel: false
velocity_smoother:
  ros__parameters:
    enable_stamped_cmd_vel: false
