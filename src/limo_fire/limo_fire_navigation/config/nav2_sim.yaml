# 시뮬(Webots)에서 nav2_params.yaml 위에 덮어쓰는 값만. 나머지(속도·footprint·costmap 등)는 실물과 같게 둔다.
# navigation.launch.xml params_override:=<이 파일> (sim.launch.xml 이 넘긴다)
#
# use_sim_time: nav2_params.yaml 은 실물용이라 여러 노드가 False 이고 costmap 은 값이 없다.
#   시뮬에서 그대로 쓰면 costmap 이 /clock 시각의 스캔을 "너무 오래됨"으로 버린다.
# AMCL 처음 위치: 시뮬 지도는 로봇이 시작 자리에 있을 때 Cartographer 로 만들어서 시작 자리가 지도 원점 (0, 0, 0) 이다.
#   그래서 로봇을 다시 시작 자리에 띄우면 2D Pose Estimate 없이 바로 주행할 수 있다.
amcl:
  ros__parameters:
    use_sim_time: True
    set_initial_pose: True
    initial_pose: {x: 0.0, y: 0.0, z: 0.0, yaw: 0.0}
bt_navigator:
  ros__parameters:
    use_sim_time: True
planner_server:
  ros__parameters:
    use_sim_time: True
controller_server:
  ros__parameters:
    use_sim_time: True
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
behavior_server:
  ros__parameters:
    use_sim_time: True
smoother_server:
  ros__parameters:
    use_sim_time: True
velocity_smoother:
  ros__parameters:
    use_sim_time: True
waypoint_follower:
  ros__parameters:
    use_sim_time: True
