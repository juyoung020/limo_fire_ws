# "○○ 로 가" 저장 지도 주행 (object_goto — navigation.launch.xml): 설 자리로 Nav2 NavigateToPose. 판단 모델 주소 · 지시 클래스 목록(decider_url · class_files)은 limo_fire_explore config/explorer.yaml 의 /explore/** 칸을 같이 읽음
/explore/object_goto:   # 노드 /explore/object_goto (navigation.launch.xml 이 이름공간 explore 로 띄움)
  ros__parameters:
    stand_dist: 0.6        # m, 물체 가운데에서 설 자리까지 최소 거리 (로봇 반 길이 0.16 + 물체 반 너비 여유) — 잠정
    stand_band: 0.6        # m, 설 자리 고리 폭 (stand_dist ~ stand_dist + stand_band)
    robot_radius: 0.25     # m, 설 자리 둘레 빈 칸 반경 (LIMO 외접 반경 0.21 + 여유) — 잠정
    occupied_threshold: 50 # 지도 값이 이 이상이면 막힘 (nav2 map_server occupied_thresh 0.65 → 65 보다 낮게, 모름(-1)은 막힘)
