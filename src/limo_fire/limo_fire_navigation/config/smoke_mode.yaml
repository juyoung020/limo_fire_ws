# 연기 모드 (limo_fire_navigation smoke_mode 노드). 설계·근거는 limo_fire_navigation/README.md "연기 모드".
# navigation.launch.xml 이 저장 지도 위치 추정(localization:=true)일 때 늘 띄운다. 켜기: ros2 service call /smoke_mode/set std_srvs/srv/SetBool "{data: true}"
smoke_mode:
  ros__parameters:
    # 연기 속 위치: hold = 바퀴 + IMU 만(들어갈 때 위치를 붙잡음)
    #   · wall = 거기에 최근 초음파 메아리를 저장 지도의 벽에 맞춰 벽에 수직인 방향만 조금씩 고침(아래 wall). 연기 모드가 꺼져 있을 때만 바꿀 수 있다
    smoke_localization: hold
    # wall: 최근 window 초 메아리(각각 그 시각 odom 자세와 함께)를 지금 추정 근처에서 벽 면에 맞춘다
    #   (include/limo_fire_navigation/sonar_wall.hpp). 값은 모두 잠정 — 시뮬 HC-SR04 모델 기준, 실물 메아리 잡음은 아직 안 쟀다
    wall:
      range_topics: ["/ultrasonic/front_left", "/ultrasonic/front_right"]
      window: 2.5          # s. 0.20 m/s 면 약 0.5 m — 그동안 바퀴 + IMU 가 거의 맞다고 본다. 4.0 → 2.5 (2026-11-20): 속도를 0.13 → 0.20 으로
                           # 올리자 4 s(0.8 m) 창에서 maze 추정 오차가 0.09 → 0.14 m 로 나빠졌고, 2.5 s(0.13 × 4 s 와 같은 약 0.5 m)로 되돌아옴 (benchmarks 결과 8)
      rate: 2.0            # Hz, 맞추기 주기
      min_hits: 8          # 지도와 맞는 메아리가 이보다 적으면 안 고침
      max_hits: 80         # 이보다 많으면 창 전체에서 고르게 솎음
      blend: 1.0           # 찾은 고침의 이만큼 (불확실성으로 이미 무게를 매기므로 1)
      echo_max_ratio: 0.95 # 이 비율 × max_range 이상은 메아리 없음 (시뮬 4.0 m, 실물 다리는 시간 초과면 max_range)
      dist_cap: 1.0        # m, 벽 거리 지도 상한
      rays: 7              # 원뿔(15°) 폭에 편 광선 수 — 보여야 할 거리 = 가장 가까운 광선
      max_range: 4.0       # m, HC-SR04 최대
      gate: 0.25           # m, |잰 − 보여야 할 거리| 가 이보다 크면 버림 (지도에 없는 물체·다른 벽)
      sigma: 0.05          # m, 끝점 ↔ 벽 면 잡음 (지도 칸 0.05 m 몫 포함). 한 메아리를 window × rate 번 다시 쓰므로 노드가 √(그 수) 배 키워 씀
      huber: 0.08          # m, 이보다 큰 잔차는 덜 믿음
      min_normal: 0.5      # 거리 지도 기울기가 이보다 작으면(모서리·벽 속) 버림
      # 추정 불확실성(칼만 꼴, 맞추기의 사전): 들어갈 때 init, 움직이면 q 만큼 커지고(분산), 맞출 때마다 줄어든다.
      # 지도와 조금 다른 물체가 같은 쪽으로 계속 당겨도 추정이 끝없이 밀려가지 않게 한다 (warehouse 2026-11-15, 결과 7)
      init_xy: 0.05        # m (σ)
      init_yaw: 0.03       # rad (σ)
      q_xy: 0.0025         # m²/m — 1 m 마다 σ 0.05 m 쯤 (거리 오차 3 % 시뮬 기준 잠정)
      q_yaw: 0.0004        # rad²/rad — 한 바퀴(2π)에 σ 0.05 rad 쯤 (잠정)
      max_step_xy: 0.10    # m, 한 번에 고치는 최대
      max_step_yaw: 0.05   # rad
      iterations: 3        # 가우스-뉴턴 횟수
    # 지도에 없는 장애물 기억: 초음파가 저장 지도보다 min_gap 넘게 가까이 잰 곳을 두께 depth 만큼 덧그려 가상 스캔(장애물 지도)이 보게 한다.
    # 초음파는 앞면만 보므로 그대로면 지나가며 옆·뒤 모서리를 스쳤다(2026-11-20 상자 시험 0.20 m/s, 6 판 중 1 판 닿음·간격 0~3 cm). 연기 모드 동안만 기억.
    # 0.7 m/s·초음파 ±10° 상자 시험 16 판 닿음 0, 간격 9~28 cm (benchmarks 결과 9)
    # 메아리 시각의 TF 가 아직 없으면(실물: 다리 시각이 EKF 보다 앞섬) 가장 최근 TF 를 이 시각 차(s) 안일 때만 쓴다
    echo_tf_tolerance: 0.3
    sonar_obstacles:
      enabled: true
      min_gap: 0.25        # m, 보여야 할 거리보다 이만큼 넘게 가까워야 장애물 (지도 오차·잡음 여유, 잠정)
      max_range: 2.0       # m, 이보다 먼 메아리는 안 씀 — 원뿔(15°)이 넓어 자리가 흐림 (2 m 에서 옆으로 ±0.26 m). 1.0 → 2.0 (2026-11-20 실물: 너무 늦게 봐서 다가간 뒤에야 피함, 빈 곳 지우기가 밀린 칸을 정리)
      always_within: 0.5   # m, 이보다 가까운 메아리는 지도에 있는 벽이어도 찍음 (연기 속 위치가 틀어져 지도 벽이 어긋나도 실제 벽을 피하게)
      depth: 0.3           # m, 잰 자리부터 뒤로 덧그리는 두께 (가정: 상자·쓰러진 물체, 잠정)
      min_hits: 2          # 칸이 이만큼 찍혀야 넣음 (메아리 하나 잡음은 무시). 원뿔 안 어디서 반사됐는지 몰라 가운데 광선에 찍는다
      carve_margin: 0.1    # m, 메아리 거리보다 이만큼 가까운 원뿔 안은 비었다고 보고 기억을 지움 (가짜 장애물 정리)
    # 앞쪽 초음파(topics) 중 하나라도 0.6 m 보다 가까우면 연기 모드 속도 한도를 slow.speed 로 (장애물을 늦게 봐 상자를 못 피함, 잠정)
    slow:
      topics: ["/ultrasonic/front_left", "/ultrasonic/front_right"]
      distance: 0.6
      speed: 0.08          # 0.05 → 0.08 (2026-11-18 사용자 요청)
      # 지도에 있는 벽에는 감속하지 않음 (2026-11-21): 2026-11-20 실물 좁은 방에서 앞 초음파가 늘 벽을 0.6 m 안에 봐 계속 기어감.
      # 메아리가 저장 지도로 보여야 할 거리보다 map_gap 넘게 가깝거나(지도에 없는 물체) always_within 보다 가까우면 감속.
      # 메아리 자세(TF)·지도를 못 구하면 감속(안전 쪽). false 면 예전처럼 가까우면 늘 감속
      only_unmapped: true
      map_gap: 0.25        # m, sonar_obstacles.min_gap 과 같은 값 (지도 오차·잡음 여유, 잠정)
      always_within: 0.3   # m, 이보다 가까우면 지도 벽이어도 감속 (연기 속 위치가 틀어져 지도 벽이 어긋날 때, 잠정)
    global_frame: map
    odom_frame: odom
    base_frame: base_link
    # map → odom 을 이 노드가 낸다(AMCL tf_broadcast: false). 늦게 묻는 쪽을 위해 AMCL transform_tolerance(1.0 s)와 같게 앞날짜
    tf_rate: 20.0
    transform_tolerance: 1.0

    # 연기 속 장애물 지도에 넣는 가상 스캔: 저장 지도에서 광선을 쏨. 각도는 실물 라이다와 같게(hardware.md: ±110°, 0.01544 rad)
    # range_max 는 global costmap raytrace_max_range(4.0 m)와 같게 — 안 닿은 빔이 그 거리까지 비운다
    virtual_scan:
      frame_id: laser_link
      rate: 10.0                 # 실물 라이다 10 Hz
      angle_min: -1.91986
      angle_max: 1.91986
      angle_increment: 0.01544
      range_min: 0.05
      range_max: 4.0
      occupied_threshold: 65     # map_server occupied_thresh 0.65

    # 연기 속 최고 속도 (m/s). 0.13 → 0.20 (2026-11-18) → 0.70 (2026-11-20 사용자 요청, Nav2 최고와 같음). 시뮬 확인: 순찰 8 판 다 도착·추정 오차 0.20 과 같음,
    # 상자 16 판 닿음 0 (benchmarks 결과 9). 실물 초음파 잡음은 아직 안 쟀다 — 실물 첫 시험은 낮게 시작
    speed_limit: 0.70

    # 연기 속 추정 자세의 불확실성 (1σ). 잠정: 바퀴 오도메트리 주행 오차는 아직 안 쟀다(hardware.md "확인할 것")
    #   xy = xy_sigma0 + xy_per_m × 이동 거리,  yaw = yaw_sigma0 + yaw_per_rad × 회전량
    # 나올 때 이 값을 /initialpose 공분산으로 AMCL 에 넘긴다
    drift:
      xy_sigma0: 0.1
      xy_per_m: 0.05
      yaw_sigma0: 0.05
      yaw_per_rad: 0.02

    # 부딪힘 의심: IMU 수평 가속도 크기가 이 값(m/s²) 이상. 잠정: 속도 평활기 가속 한도 2.5 m/s² 보다 크게.
    # 정지 잡음은 x 0.045 · y 0.030 m/s²(hardware.md). 메카넘 바퀴 주행 진동은 아직 안 쟀다
    bump:
      accel: 4.0
      holdoff: 1.0               # s, 한 번 부딪힘을 여러 번 알리지 않게
