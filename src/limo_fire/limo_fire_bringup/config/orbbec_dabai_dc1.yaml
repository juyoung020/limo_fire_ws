# Orbbec Dabai DC1 깊이 카메라. WeGo 가 쓰는 orbbec_camera astra_stereo_u3.launch.py 의 기본값 그대로
# (그 launch 는 값을 launch 인자로만 갖고 있어서 여기 파일로 옮겼다)
/**:
  ros__parameters:
    camera_name: camera
    depth_registration: false
    serial_number: ""
    usb_port: ""
    device_num: 1
    vendor_id: "0x2bc5"
    product_id: ""
    enable_point_cloud: true
    enable_colored_point_cloud: true
    point_cloud_qos: default
    connection_delay: 100
    color_width: 640
    color_height: 480
    color_fps: 30
    color_format: MJPG
    enable_color: true
    flip_color: false
    color_qos: default
    color_camera_info_qos: default
    enable_color_auto_exposure: true
    color_exposure: -1
    color_gain: -1
    enable_color_auto_white_balance: true
    color_white_balance: -1
    depth_width: 640
    depth_height: 400
    depth_fps: 30
    depth_format: Y11
    enable_depth: true
    flip_depth: false
    depth_qos: default
    depth_camera_info_qos: default
    ir_width: 640
    ir_height: 400
    ir_fps: 30
    ir_format: Y10
    enable_ir: true
    flip_ir: false
    ir_qos: default
    ir_camera_info_qos: default
    enable_ir_auto_exposure: true
    ir_exposure: -1
    ir_gain: -1
    publish_tf: true
    tf_publish_rate: 10.0
    ir_info_url: ""
    color_info_url: ""
    log_level: none
    enable_publish_extrinsic: false
    enable_d2c_viewer: false
    enable_ldp: true
    enable_soft_filter: true
    soft_filter_max_diff: -1
    soft_filter_speckle_size: -1
    ordered_pc: false
    use_hardware_time: false
    enable_depth_scale: true
    align_mode: HW
    laser_energy_level: -1
