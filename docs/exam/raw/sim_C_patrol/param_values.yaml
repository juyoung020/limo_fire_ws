# ################ /smoke_mode
/smoke_mode:
  ros__parameters:
    base_frame: base_link
    bump:
      accel: 4.0
      holdoff: 1.0
    drift:
      xy_per_m: 0.05
      xy_sigma0: 0.1
      yaw_per_rad: 0.02
      yaw_sigma0: 0.05
    global_frame: map
    odom_frame: odom
    publish_map_odom: true
    qos_overrides:
      /clock:
        subscription:
          depth: 1
          durability: volatile
          history: keep_last
          reliability: best_effort
      /parameter_events:
        publisher:
          depth: 1000
          durability: volatile
          history: keep_last
          reliability: reliable
      /tf:
        publisher:
          depth: 100
          durability: volatile
          history: keep_last
          reliability: reliable
    slow:
      distance: 0.6
      speed: 0.05
      topics:
      - /ultrasonic/front_left
      - /ultrasonic/front_right
    smoke_localization: hold
    speed_limit: 0.13
    tf_rate: 20.0
    transform_tolerance: 1.0
    use_sim_time: true
    virtual_scan:
      angle_increment: 0.01544
      angle_max: 1.91986
      angle_min: -1.91986
      frame_id: laser_link
      occupied_threshold: 65
      range_max: 4.0
      range_min: 0.05
      rate: 10.0
    wall:
      blend: 1.0
      dist_cap: 1.0
      echo_max_ratio: 0.95
      gate: 0.25
      huber: 0.08
      init_xy: 0.05
      init_yaw: 0.03
      iterations: 3
      max_hits: 80
      max_range: 4.0
      max_step_xy: 0.1
      max_step_yaw: 0.05
      min_hits: 8
      min_normal: 0.5
      q_xy: 0.0025
      q_yaw: 0.0004
      range_topics:
      - /ultrasonic/front_left
      - /ultrasonic/front_right
      rate: 2.0
      rays: 7
      sigma: 0.05
      window: 4.0

# ################ /smoother_server
/smoother_server:
  ros__parameters:
    /bond_disable_heartbeat_timeout: true
    costmap_topic: global_costmap/costmap_raw
    footprint_topic: global_costmap/published_footprint
    qos_overrides:
      /clock:
        subscription:
          depth: 1
          durability: volatile
          history: keep_last
          reliability: best_effort
    robot_base_frame: base_link
    simple_smoother:
      do_refinement: false
      max_its: 10
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 0.1
      w_data: 0.2
      w_smooth: 0.3
    smoother_plugins:
    - simple_smoother
    transform_tolerance: 0.1
    use_sim_time: true

# ################ /velocity_smoother
/velocity_smoother:
  ros__parameters:
    /bond_disable_heartbeat_timeout: true
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    feedback: OPEN_LOOP
    max_accel:
    - 2.5
    - 0.0
    - 3.2
    max_decel:
    - -2.5
    - 0.0
    - -3.2
    max_velocity:
    - 0.26
    - 0.0
    - 1.0
    min_velocity:
    - -0.26
    - 0.0
    - -1.0
    odom_duration: 0.1
    odom_topic: /odom
    qos_overrides:
      /clock:
        subscription:
          depth: 1
          durability: volatile
          history: keep_last
          reliability: best_effort
    scale_velocities: false
    smoothing_frequency: 20.0
    use_sim_time: true
    velocity_timeout: 1.0

# ################ /waypoint_follower
/waypoint_follower:
  ros__parameters:
    /bond_disable_heartbeat_timeout: true
    loop_rate: 5
    qos_overrides:
      /clock:
        subscription:
          depth: 1
          durability: volatile
          history: keep_last
          reliability: best_effort
    stop_on_failure: false
    use_sim_time: true
    wait_at_waypoint:
      enabled: true
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      waypoint_pause_duration: 1000
    waypoint_task_executor_plugin: wait_at_waypoint

# ################ /ydlidar_ros2_driver_node
/ydlidar_ros2_driver_node:
  ros__parameters:
    use_sim_time: false

