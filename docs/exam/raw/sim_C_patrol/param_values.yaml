# ################ /local_costmap/local_costmap
/local_costmap/local_costmap:
  ros__parameters:
    /bond_disable_heartbeat_timeout: true
    always_send_full_costmap: true
    filters: []
    footprint: '[[-0.16, -0.11], [-0.16, 0.11], [0.16, 0.11], [0.16, -0.11]]'
    footprint_padding: 0.02
    global_frame: odom
    height: 3
    inflation_layer:
      cost_scaling_factor: 3.0
      enabled: true
      inflate_around_unknown: false
      inflate_unknown: false
      inflation_radius: 0.45
      plugin: nav2_costmap_2d::InflationLayer
    lethal_cost_threshold: 100
    map_topic: /map
    observation_sources: ''
    obstacle_layer:
      combination_method: 1
      enabled: true
      footprint_clearing_enabled: true
      max_obstacle_height: 0.1
      min_obstacle_height: -0.5
      observation_sources: scan
      plugin: nav2_costmap_2d::ObstacleLayer
      scan:
        clearing: true
        data_type: LaserScan
        expected_update_rate: 0.0
        inf_is_valid: false
        marking: true
        max_obstacle_height: 0.1
        min_obstacle_height: -0.5
        observation_persistence: 0.0
        obstacle_max_range: 1.0
        obstacle_min_range: 0.0
        raytrace_max_range: 1.5
        raytrace_min_range: 0.0
        sensor_frame: ''
        topic: /scan_obstacles
    origin_x: 0.0
    origin_y: 0.0
    plugins:
    - obstacle_layer
    - range_layer
    - inflation_layer
    publish_frequency: 2.0
    qos_overrides:
      /clock:
        subscription:
          depth: 1
          durability: volatile
          history: keep_last
          reliability: best_effort
    range_layer:
      clear_on_max_reading: true
      clear_threshold: 0.2
      enabled: true
      inflate_cone: 1.0
      input_sensor_type: ALL
      mark_threshold: 0.8
      no_readings_timeout: 0.0
      phi: 1.2
      plugin: nav2_costmap_2d::RangeSensorLayer
      topics:
      - /ultrasonic/front_left
      - /ultrasonic/front_right
    resolution: 0.05
    robot_base_frame: base_link
    robot_radius: 0.1
    rolling_window: true
    track_unknown_space: false
    transform_tolerance: 0.5
    trinary_costmap: true
    unknown_cost_value: 255
    update_frequency: 2.0
    use_maximum: false
    use_sim_time: true
    width: 3

# ################ /map_server
/map_server:
  ros__parameters:
    /bond_disable_heartbeat_timeout: true
    frame_id: map
    qos_overrides:
      /clock:
        subscription:
          depth: 1
          durability: volatile
          history: keep_last
