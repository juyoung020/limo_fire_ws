# limo_fire_world.wbt 에 놓은 YOLO 정답 물체 (Webots 세계 좌표, m). YOLO 벤치마크에서 카메라에 투영해 2D 정답 상자를 만든다.
# center: 물체 가운데, size: [x 폭, y 폭, 높이] (회전 전, 물체 자기 축). approx: true 면 Webots 모델 크기를 눈대중으로 적은 값 — Webots 에서 재서 고칠 것
# 클래스 번호는 train/detect 와 같다: 0 fire · 1 smoke · 2 fire_extinguisher · 3 exit_sign · 4 person · 5 door · 6 stairs
world: worlds/limo_fire_world.wbt
robot_start: {x: 6.36, y: 0.0, yaw: 0.0}
