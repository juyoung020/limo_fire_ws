# This is a proto file for Webots for the LimoFourDiff (four-wheel differential drive AgileX LIMO).
# Assets adopted from py_bt_ros scenario (correct colors and hinge axes),
# with the rear_left_wheel boundingObject bug fixed.

# limo_fire 판: 교수님 webots_ros2_limo/protos/LimoFourDiff.proto 복사본. 다른 점
#   1. rgb_camera 에 Recognition(분할) — 인식 벤치마크 정답 (limo_fire_sim GtCamera, sim/webots/README.md "인식 정답")
#   2. 메시 경로를 원본 자리로
#   3. wheelRadiusScale — 바퀴 접촉 원기둥 반지름 배율. 센서 플러그인(limo_sensors.py)은 반지름 0.045 m 로 거리를 세므로 1 이 아니면
#      오도메트리 거리가 그만큼 틀린다(시뮬 오도메트리 오차, docs/smoke_mode_plan.md). 기본 1.0 = 원본과 같음
#   4. ultrasonic — TRUE 면 초음파 HC-SR04 2 개(sonar_front_left·sonar_front_right, 연기 모드). 기본 FALSE = 원본과 같음.
#      자리는 limo_fire_description urdf/limo_fire.urdf.xacro 와 같게 (잠정 — hardware/mounts 초음파 받침 그림에서 읽음, 실측 아님)
# 원본이 바뀌면 같이 맞춘다: diff src/external/webots_ros2_limo/protos/LimoFourDiff.proto sim/webots/protos/LimoFire.proto
PROTO LimoFire [
  field  SFVec3f     translation     0 0 0
  field  SFRotation  rotation        0 0 1 0
  field  SFString    name            "LimoFourDiff"  # Is `Robot.name`.
  field  SFString    controller      "<extern>"      # Is `Robot.controller`.
  field  MFString    controllerArgs  []              # Is `Robot.controllerArgs`.
  field  SFString    customData      ""              # Is `Robot.customData`.
  field  SFBool      supervisor      FALSE           # Is `Robot.supervisor`.
  field  SFBool      synchronization TRUE            # Is `Robot.synchronization`.
  field  SFBool      selfCollision   FALSE           # Is `Robot.selfCollision`.
  field  SFBool      ultrasonic      FALSE           # limo_fire: 초음파 2 개 켬 (연기 모드)
  field  SFFloat     wheelRadiusScale 1.0            # limo_fire: 바퀴 실제 반지름 = 0.045 m × 이 값 (1.0 = 원본, 시뮬 오도메트리 거리 오차 실험용)
]
{
  Robot {
    translation IS translation
    rotation IS rotation
    controller IS controller
    controllerArgs IS controllerArgs
    customData IS customData
    supervisor IS supervisor
    synchronization IS synchronization
    selfCollision IS selfCollision
    children [
      # Base body visual mesh
      Pose {
        translation 0.000000 0.000000 -0.150000
        rotation 0.000000 0.000000 1.000000 1.570000
        children [
          DEF limo_base_visual CadShape {
            url "../../../src/external/webots_ros2_limo/protos/meshes/limo_base.dae"
          }
        ]
      }
      # Lidar sensor (height matches AgileX official limo_four_diff.xacro: 0.111 m above ground)
      Solid {
        translation 0.103000 0.000000 -0.034000
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 0.500000 0.500000 0.500000
              roughness 1.000000
              metalness 0
            }
            geometry Cylinder {
              radius 0.02
              height 0.01
            }
          }
          Lidar {
            # Real LIMO: YDLIDAR (ydlidar_ros2_driver, 10 Hz, 405 beams/turn) cropped by the
            # driver to +-110 deg = 248 beams. One Webots ray per published beam;
            # the limo_sensors plugin turns this into the exact /scan of the robot.
            name "laser"
            fieldOfView 3.839724
            horizontalResolution 248
            numberOfLayers 1
            near 0.1
            minRange 0.1
            maxRange 12.000000
            noise 0.003000
            resolution 0.015000
          }
        ]
        name "laser_link"
        boundingObject Cylinder {
          radius 0.032
          height 0.016
        }
        physics Physics {
          density -1
          mass 0.100000
          centerOfMass [ 0.000000 0.000000 0.000000 ]
          inertiaMatrix [
            1.000000e-06 1.000000e-06 1.000000e-06
            0.000000e+00 0.000000e+00 0.000000e+00
          ]
        }
      }
      # Orbbec DaBai DC1 depth camera (body, collision and mass unchanged). The camera mount
      # TFs in robot_launch.py put camera_link on the depth/IR lens below.
      # Color + aligned depth share the color intrinsics (fx = fy = 490.9 px). Each stream is
      # rendered a bit larger than published and cropped by the limo_sensors plugin so that the
      # principal point lands where the real camera_info has it (cx 317.5, cy 217.4):
      #   FOV = 2 * atan(322 / 490.8955) for a 644 px wide render.
      Solid {
        translation 0.084000 0.000000 0.030000
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 0.500000 0.500000 0.500000
              roughness 1.000000
              metalness 0
            }
            geometry Box {
              size 0.020000 0.060000 0.015000
            }
          }
          Pose {
            # Lens positions on the front face of the box (x 0.094 m from base_link).
            # camera_link (depth/IR lens) = (0.096, 0.015, 0.03) from base_link.
            translation 0.012000 0.015000 0.000000
            children [
              Pose {
                # camera_color_frame, 3 cm to the right of camera_link (as on the robot)
                translation 0.000150 -0.030000 0.000020
                children [
                  Camera {
                    name "rgb_camera"
                    fieldOfView 1.161085
                    width 644
                    height 524
                    # limo_fire: 인식 벤치마크 정답 (분할 영상). limo_fire_sim GtCamera 가 받는 쪽이 있을 때만 켠다
                    recognition Recognition {
                      segmentation TRUE
                      frameThickness 0
                    }
                  }
                  RangeFinder {
                    name "depth_camera"
                    fieldOfView 1.161085
                    width 644
                    height 524
                    near 0.010000
                    minRange 0.010000
                    maxRange 3.000000
                  }
                ]
              }
              Camera {
                name "ir_camera"
                fieldOfView 1.161085
                width 644
                height 436
              }
            ]
          }
        ]
        name "depth_camera_link"
        boundingObject Box {
          size 0.020000 0.060000 0.015000
        }
        physics Physics {
          density -1
          mass 0.100000
          centerOfMass [ 0.000000 0.000000 0.000000 ]
          inertiaMatrix [
            1.000000e-06 1.000000e-06 1.000000e-06
            0.000000e+00 0.000000e+00 0.000000e+00
          ]
        }
      }
      # IMU sensor block
      Solid {
        translation 0.000000 0.000000 -0.100000
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 0.500000 0.500000 0.500000
              roughness 1.000000
              metalness 0
            }
            geometry Box {
              size 0.001000 0.001000 0.001000
            }
          }
          InertialUnit {
            name "imu inertial"
          }
          Accelerometer {
            name "imu accelerometer"
          }
          Gyro {
            name "imu gyro"
          }
          Compass {
            name "imu compass"
          }
        ]
        name "imu_link"
        boundingObject Box {
          size 0.001000 0.001000 0.001000
        }
        physics Physics {
          density -1
          mass 0.010000
          centerOfMass [ 0.000000 0.000000 0.000000 ]
          inertiaMatrix [
            1.000000e-07 1.000000e-07 1.000000e-07
            0.000000e+00 0.000000e+00 0.000000e+00
          ]
        }
      }
      %< if (fields.ultrasonic.value) { >%
      # limo_fire: 초음파 HC-SR04 × 2, 앞 범퍼 아래 받침에 좌우 ±20°·위 5° (hardware/mounts print_sonar). 데이터시트: 2~400 cm, 감지 각 15°. 원뿔은 광선 5 개 — Webots 가 합친 값이 실물(가장 가까운 메아리)과 다를 수 있다(확인할 것).
      # lookupTable 셋째 열 = 잡음 표준편차 / 값 (1 %, 잠정 — 실측 전). 400 cm 넘으면 400 cm(메아리 없음 = 최대) 로 자른다
      # 메아리 없음(4.0 m)에는 잡음을 안 붙인다 — 붙이면 일부가 메시지 max_range(3.96 m) 아래로 떨어져 장애물 지도에 3.9 m 앞 가짜 장애물로 찍힌다
      # (11-13 측정: 메아리 없음 38 개 중 7 개). 실물 ESP32 다리도 시간 초과면 max_range 그대로 낸다
      # 회전 = z 축 ±20° 다음 y 축 −5°(위로) 를 축·각 하나로 합친 값 — 측정 방향(x)이 (0.936, ±0.341, 0.087)
      %< const sonars = [['sonar_front_left', '0.18 0.025 -0.06', '0.042343 -0.240139 0.969815 0.359701'], ['sonar_front_right', '0.18 -0.025 -0.06', '-0.042343 -0.240139 -0.969815 0.359701']]; >%
      %< for (const s of sonars) { >%
      DistanceSensor {
        translation %<= s[1] >%
        rotation %<= s[2] >%
        name "%<= s[0] >%"
        type "sonar"
        lookupTable [ 0.02 0.02 0.01, 3.99 3.99 0.01, 4.0 4.0 0 ]
        numberOfRays 5
        aperture 0.2618
      }
      %< } >%
      %< } >%
      # Front left wheel
      HingeJoint {
        jointParameters HingeJointParameters {
          axis 0.000000 1.000000 0.000000
          anchor 0.100000 0.065000 -0.100000
        }
        device [
          RotationalMotor {
            name "front_left_wheel"
            maxTorque 10000
          }
          PositionSensor {
            name "front_left_wheel_sensor"
          }
        ]
        endPoint Solid {
          translation 0.100000 0.065000 -0.100000
          children [
            DEF limo_wheel_visual CadShape {
              url "../../../src/external/webots_ros2_limo/protos/meshes/limo_wheel.dae"
            }
          ]
          name "front_left_wheel_link"
          contactMaterial "wheel"
          boundingObject Pose {
            translation 0.000000 0.022500 0.000000
            rotation 1.000000 0.000000 0.000000 1.570000
            children [
              Cylinder {
                radius %<= 0.045 * fields.wheelRadiusScale.value >%
                height 0.045
              }
            ]
          }
          physics Physics {
            density -1
            mass 0.500000
            centerOfMass [ 0.000000 0.000000 0.000000 ]
            inertiaMatrix [
              1.055000e-02 7.500000e-04 1.055000e-02
              0.000000e+00 0.000000e+00 0.000000e+00
            ]
          }
        }
      }
      # Front right wheel
      HingeJoint {
        jointParameters HingeJointParameters {
          axis 0.000000 1.000000 -0.000003
          anchor 0.100000 -0.065000 -0.100000
        }
        device [
          RotationalMotor {
            name "front_right_wheel"
            maxTorque 10000
          }
          PositionSensor {
            name "front_right_wheel_sensor"
          }
        ]
        endPoint Solid {
          translation 0.100000 -0.065000 -0.100000
          rotation 1.000000 0.000000 0.000000 3.141590
          children [
            USE limo_wheel_visual
          ]
          name "front_right_wheel_link"
          contactMaterial "wheel"
          boundingObject Pose {
            translation 0.000000 0.022500 0.000000
            rotation 1.000000 0.000000 0.000000 1.570000
            children [
              Cylinder {
                radius %<= 0.045 * fields.wheelRadiusScale.value >%
                height 0.045
              }
            ]
          }
          physics Physics {
            density -1
            mass 0.500000
            centerOfMass [ 0.000000 0.000000 0.000000 ]
            inertiaMatrix [
              1.055000e-02 7.500000e-04 1.055000e-02
              0.000000e+00 0.000000e+00 0.000000e+00
            ]
          }
        }
      }
      # Rear left wheel (boundingObject Pose opening was missing in source; fixed here)
      HingeJoint {
        jointParameters HingeJointParameters {
          axis 0.000000 1.000000 0.000000
          anchor -0.100000 0.065000 -0.100000
        }
        device [
          RotationalMotor {
            name "rear_left_wheel"
            maxTorque 10000
          }
          PositionSensor {
            name "rear_left_wheel_sensor"
          }
        ]
        endPoint Solid {
          translation -0.100000 0.065000 -0.100000
          children [
            USE limo_wheel_visual
          ]
          name "rear_left_wheel_link"
          contactMaterial "wheel"
          boundingObject Pose {
            translation 0.000000 0.022500 0.000000
            rotation 1.000000 0.000000 0.000000 1.570000
            children [
              Cylinder {
                radius %<= 0.045 * fields.wheelRadiusScale.value >%
                height 0.045
              }
            ]
          }
          physics Physics {
            density -1
            mass 0.500000
            centerOfMass [ 0.000000 0.000000 0.000000 ]
            inertiaMatrix [
              1.055000e-02 7.500000e-04 1.055000e-02
              0.000000e+00 0.000000e+00 0.000000e+00
            ]
          }
        }
      }
      # Rear right wheel
      HingeJoint {
        jointParameters HingeJointParameters {
          axis 0.000000 1.000000 -0.000003
          anchor -0.100000 -0.065000 -0.100000
        }
        device [
          RotationalMotor {
            name "rear_right_wheel"
            maxTorque 10000
          }
          PositionSensor {
            name "rear_right_wheel_sensor"
          }
        ]
        endPoint Solid {
          translation -0.100000 -0.065000 -0.100000
          rotation 1.000000 0.000000 0.000000 3.141590
          children [
            USE limo_wheel_visual
          ]
          name "rear_right_wheel_link"
          contactMaterial "wheel"
          boundingObject Pose {
            translation 0.000000 0.022500 0.000000
            rotation 1.000000 0.000000 0.000000 1.570000
            children [
              Cylinder {
                radius %<= 0.045 * fields.wheelRadiusScale.value >%
                height 0.045
              }
            ]
          }
          physics Physics {
            density -1
            mass 0.500000
            centerOfMass [ 0.000000 0.000000 0.000000 ]
            inertiaMatrix [
              1.055000e-02 7.500000e-04 1.055000e-02
              0.000000e+00 0.000000e+00 0.000000e+00
            ]
          }
        }
      }
    ]
    name IS name
    model "LimoFourDiff"  # tells the limo_sensors plugin which wheel kinematics to use
    boundingObject Box {
      size 0.130000 0.120000 0.100000
    }
    physics Physics {
      density -1
      mass 2.155700
      centerOfMass [ 0.000000 0.000000 0.000000 ]
      inertiaMatrix [
        2.400000e-01 9.600000e-01 9.600000e-01
        0.000000e+00 0.000000e+00 0.000000e+00
      ]
    }
  }
}
