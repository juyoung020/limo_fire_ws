[package]
name = "trainview"
version = "0.2.0"
edition = "2021"
description = "탐사 RL 학습 뷰어: 실행 폴더를 읽기만 하는 Rust 서버 + 순수 JS 화면(곡선·표·2D 재생·비교)."

[dependencies]
serde_json = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
trainfmt = { path = "trainfmt" }

[[bin]]
name = "trainview"
path = "src/main.rs"

[[bin]]
name = "runcheck"
path = "src/bin/runcheck.rs"

[profile.release]
opt-level = 3

[workspace]
members = ["trainfmt"]
