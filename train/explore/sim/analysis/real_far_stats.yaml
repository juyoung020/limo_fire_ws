# 라이다 먼 거리 돌아옴 — 실측 (tools/far_check 가 읽음). 2026-11-04, 1104 실험실 (넓은 곳, 벽 3~9 m).
# 만든 법 (일회성 분석, scratchpad far/ 의 Python: dump·curve·reg·gt·curve2·export):
#   1. 정지 묶음: 1104_R_static_aligned 전체 580 장(오도메트리 없음 = 세워 둠), 1104_M_cmd_mecanum·1104_M_cmd_mix 는
#      /odom |vx|+|vy|+0.2|ω| < 0.01 이 1 s 넘는 멈춤마다 (앞 0.3 s · 뒤 0.1 s 뺌, 8 장 이상).
#   2. 각도 칸: 빔을 드라이버 각도(angle_min + j·간격)로 2π/405 칸에 넣는다 (장마다 빔 수 239~258 이 바뀌어도 같은 방향끼리).
#      칸마다 돌아온 장 k / 장 n, 돌아온 값 중앙값.
#   3. 묶음 맞추기: 돌아온 칸 중앙값 점(7 m 안)을 static 묶음에 ICP (첫 짐작은 motion_export 의 라이다 몸 자세 lo_*).
#      맞춘 점 5 cm 안 몫 < 0.5 인 묶음 5 곳(cmd_mix @47.8·59.9·65.7·71.4·120.9 — 크게 돈 뒤)은 뺌 → 60 곳.
#   4. 정답 거리: 모든 묶음의 돌아온 점(+ 같은 묶음 이웃 칸이 이어지면 선)으로 5 cm 격자 지도(~/limo_bags/maps/far_1104.pgm)를 만들고,
#      돌아온 칸은 그 중앙값, 한 번도 안 돌아온 칸은 이 지도에 쏜 거리(다른 자리에서 본 면) — 어느 자리에서도 안 보인 방향(열린 곳이거나
#      늘 안 돌아오는 면)은 거리를 몰라 뺀다. 이웃 칸 정답 거리가 max(0.15 m, 0.04·r) 넘게 다르면 모서리라 뺀다 (모서리 모델은 따로).
#   5. 구간마다 ret = Σk / Σn (장마다 돌아오는 몫), mid = 칸별 유효율 5~95 % 인 칸 몫 (깜빡임), beams = 칸 수(묶음 × 칸).
# 역할: fit = 1104_R_static_aligned + 1104_M_cmd_mecanum 멈춤 23 곳, validate = 1104_M_cmd_mix 멈춤 36 곳 (analysis/calibration.yaml far:).
# 한계: 9.4 m 넘는 돌아옴은 1104 녹화 모두(3,100 장)에 하나도 없고, 그 너머 방향은 정답 거리를 몰라 9.5 m 넘는 구간은 비어 있다.
#   0 빔의 정답 거리는 다른 자리에서 그 면이 보였을 때만 있다 — 어디서도 안 보인 먼 면은 이 표에서 빠진다(먼 빠짐을 덜 셈).
