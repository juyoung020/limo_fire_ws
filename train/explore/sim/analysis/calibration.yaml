# 보정 녹화 목록 — 학습 시뮬을 실물에 맞추고(fit) 다른 녹화로 확인(validate)한다. 도구가 --set 으로 이 파일을 읽는다:
#   motion_check --set analysis/calibration.yaml fit --fit   → 구동·바닥 값 맞춤 (env.yaml 에 넣을 값)
#   motion_check --set analysis/calibration.yaml validate    → 맞춘 값이 다른 녹화에서도 맞는지
#   replay_check --set analysis/calibration.yaml validate    → GPU 환경 전체 · 라이다 (--fit-dropout 은 fit 녹화로)
# 녹화마다 먼저 만들어 둔다 (data 폴더에 <name>.csv · <name>.lfrec · <name>.lfrec.map.yaml · <name>.scene):
#   ros2 run limo_fire_sim motion_export <bag> <data>/<name>.csv
#   ros2 run limo_fire_sim bag_export <bag> <data>/<name>.lfrec
#   ./build/map2scene <data>/<name>.lfrec.map.yaml <data>/<name>.scene
# 녹화 설명·조건은 bags.md. skip 은 [시작, 끝] (s, 그 녹화 처음 기준) — 구동 응답이 아닌 곳과 까닭을 적는다.
data: ../build/real          # 이 파일 기준

recordings:
  # 맞추기는 크게 흔든 녹화(급반전·급가속)로 — 약한 녹화로 맞추면 센 동작을 모른다. 확인은 다른 녹화로
  - name: cmd1
    bag: 1103_M_cmd1
    role: validate
    floor: office
    skip: [[186.3, 188.2]]   # 첫 +0.5 m/s 에 바퀴가 안 돎 (앞이 막힘 — replay 에서 시뮬도 그 자리 벽에 닿음)
    replay_from: 188.2
  - name: cmd2
    bag: 1103_M_cmd2
    role: fit
    floor: office
    skip: [[0, 4.7]]         # 녹화기가 새 /cmd_vel 발행자를 늦게 알아채 명령이 빠짐
    replay_from: 8.2         # 로봇이 멈춰 있는 때부터
  - name: drive3
    bag: 1103_M_drive3
    role: fit
    floor: office
    skip: [[42, 43.5], [55, 57.5], [59, 61]]   # 부딪힌 순간 (수평 가속 7 · 92 · 26 m/s²)
