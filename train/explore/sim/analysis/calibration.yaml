# 보정 녹화 목록 — 학습 시뮬을 실물에 맞추고(fit) 다른 녹화로 확인(validate)한다. 도구가 --set 으로 이 파일을 읽는다:
#   motion_check --set analysis/calibration.yaml fit --fit   → 구동·바닥 값 맞춤 (env.yaml 에 넣을 값)
#   motion_check --set analysis/calibration.yaml validate    → 맞춘 값이 다른 녹화에서도 맞는지
#   replay_check --set analysis/calibration.yaml validate    → GPU 환경 전체 · 라이다 (--fit-dropout 은 fit 녹화로)
#   imu_check · mapvel_check · depth_check · intensity_check [--fit]  → 아래 imu: · mapvel: · depth: · intensity: 목록 (IMU·지도 속도·깊이·라이다 세기)
# 녹화마다 먼저 만들어 둔다 (data 폴더에 <name>.csv · <name>.lfrec · <name>.lfrec.map.yaml · <name>.scene):
#   ros2 run limo_fire_sim motion_export <bag> <data>/<name>.csv
#   ros2 run limo_fire_sim bag_export <bag> <data>/<name>.lfrec
#   ./build/map2scene <data>/<name>.lfrec.map.yaml <data>/<name>.scene
# 녹화 설명·조건은 bags.md. skip 은 [시작, 끝] (s, 그 녹화 처음 기준) — 구동 응답이 아닌 곳과 까닭을 적는다.
data: ../build/real          # 이 파일 기준

recordings:
  # 맞추기는 크게 흔든 녹화(급반전·급가속)로 — 약한 녹화로 맞추면 센 동작을 모른다. 확인은 다른 녹화로
  - name: cmd1
    bag: 1103_M_cmd1
    role: validate
    floor: office
    skip: [[186.3, 188.2]]   # 첫 +0.5 m/s 에 바퀴가 안 돎 (앞이 막힘 — replay 에서 시뮬도 그 자리 벽에 닿음)
    replay_from: 188.2
  - name: cmd2
    bag: 1103_M_cmd2
    role: fit
    floor: office
    skip: [[0, 4.7]]         # 녹화기가 새 /cmd_vel 발행자를 늦게 알아채 명령이 빠짐
    replay_from: 8.2         # 로봇이 멈춰 있는 때부터
  - name: drive3
    bag: 1103_M_drive3
    role: fit
    floor: office
    skip: [[42, 43.5], [55, 57.5], [59, 61]]   # 부딪힌 순간 (수평 가속 7 · 92 · 26 m/s²)

# 몸 참값 — motion_check --set analysis/calibration.yaml fit|validate --body [--fit] [--table]. CSV 는 motion_export (라이다 스캔 맞추기 몸 자세 lo_* 열).
# 명령 → 몸 움직임(라이다 몸 vx · 자이로 ω · 정지→정지 이동)과 멈춤 응답. 옆(vy) 명령 구간은 도구가 스스로 뺀다 (시뮬은 정상 메카넘 가정, real_limo.md 구동 절).
# 맞춤은 앞뒤 단독 ±0.3·±0.6·±1.0 m/s 와 제자리 ±1·±2·±3 rad/s 가 다 든 mecanum (넓은 범위), 확인은 v·ω 조합만 든 mix
body:
  - {name: 1104_M_cmd_mecanum, bag: 1104_M_cmd_mecanum, role: fit, floor: lab}
  - {name: 1104_M_cmd_mix, bag: 1104_M_cmd_mix, role: validate, floor: lab}

# IMU (가속도 x·y·z, 자이로 x·y, roll·pitch) — tools/imu_check (--fit 은 fit 녹화로). CSV 는 data 폴더의 <bag>.csv:
#   ros2 run limo_fire_sim motion_export ~/limo_bags/<bag> <data>/<bag>.csv   (IMU 원값·지도 자세 열 — 지도 속도 mapvel: 도 같은 파일)
# kind rest: 세워 둔 녹화(바닥 기울기·정지 잡음), drive: 주행(진동·기울기 응답). 정지 맞춤은 spot1·2·mapping 정지, 확인은 spot3.
imu:
  - {bag: 1103_R1_spot1, role: fit, kind: rest}
  - {bag: 1103_R1_spot2, role: fit, kind: rest}
  - {bag: mapping_1026_1900, role: fit, kind: rest}      # 정지 114 s + 손 조종 86 s
  - {bag: 1103_M_cmd2, role: fit, kind: drive, skip: [[0, 4.7]]}
  - {bag: 1103_M_drive3, role: fit, kind: drive, skip: [[42, 43.5], [55, 57.5], [59, 61]]}   # 부딪힌 순간
  - {bag: 1103_R1_spot3, role: validate, kind: rest}
  - {bag: 1103_M_cmd1, role: validate, kind: drive, skip: [[186.3, 188.2]]}
  - {bag: 1103_M_drive1, role: validate, kind: drive}
  # 1104 실험실 명령 계단 (옆 명령 구간은 imu_check 가 스스로 뺌): 느린 속도 진동 확인만. 실험실 바닥은 주행 진동이 사무실보다 작아
  # (움직일 때 분산 0.3~0.5 배) 한 모델로는 못 맞춤 — 다시 맞춘 세 가지 모두 확인 녹화에서 기준 밖이라 설정은 1103 맞춤 그대로 (real_limo.md IMU 절)
  - {bag: 1104_M_cmd_mecanum, role: validate, kind: drive}
  - {bag: 1104_M_cmd_mix, role: validate, kind: drive}

# 깊이 카메라 — tools/depth_check (--fit 은 fit 녹화로). 통계는 녹화마다 data 폴더에:
#   depth_stats_bag <data>/<bag>.depth.yaml ~/limo_bags/<bag> [--static] --cam-h 0.1881 --cam-pitch 0.1152
#   (--cam-h·--cam-pitch 는 바닥 구멍 통계용 카메라 자세 — 먼저 기본값으로 돌려 나온 floor_plane 을 넣는다)
# 2026-11-04 부터 깊이를 컬러에 정렬(depth_registration true, 640 × 480 의 위 400 행) — 정렬 켬 녹화만 쓴다 (--rows 400):
#   depth_stats_bag <data>/<bag>.depth.yaml ~/limo_bags/<bag> [--static] --rows 400 --cam-h 0.1869 --cam-pitch 0.0902
# 정렬 안 한 예전 녹화(static_1103_floor fit · 1103_M_drive1 validate)는 사무실 바닥 구멍 범위(sensor_model.yaml depth.holes.floor)의 근거로만 남긴다
depth:
  - {bag: 1104_R_static_aligned, role: fit}   # 실험실 세워 둔 58 s: 시간 σ · 바닥·모서리 구멍 · 카메라 자세 · 유효 영역
  - {bag: 1104_M_cmd_mecanum, role: validate} # 실험실 명령 계단 88 s: 멈춘 구간 2 개로 시간 σ, 장마다 구멍

# 지도 속도 (Cartographer 지도 자세 0.1 s 미분) — tools/mapvel_check (--fit 은 fit 녹화로). CSV 는 motion_export (map_* · mo_* 열).
# 정지 녹화는 Cartographer 가 돌던 사무실 세 자리 (spot1·2 fit, spot3 validate).
mapvel:
  - {bag: 1103_R1_spot1, role: fit, kind: rest}
  - {bag: 1103_R1_spot2, role: fit, kind: rest}
  - {bag: 1103_M_cmd2, role: fit, kind: drive, skip: [[0, 4.7]]}
  - {bag: 1103_M_drive3, role: fit, kind: drive, skip: [[42, 43.5], [55, 57.5], [59, 61]]}
  - {bag: 1103_R1_spot3, role: validate, kind: rest}
  - {bag: 1103_M_cmd1, role: validate, kind: drive, skip: [[186.3, 188.2]]}
  - {bag: 1103_M_drive1, role: validate, kind: drive}

# 라이다 세기 — tools/intensity_check (--fit 은 fit 통계로). data 폴더에 limo_fire_sim intensity_stats_bag 으로:
#   intensity_fit.yaml      ← static_1103_floor · 1103_R1_spot1 · 1103_R1_spot2 (정지)
#   intensity_validate.yaml ← 1103_R1_spot3 (정지)
intensity:
  fit: intensity_fit.yaml
  validate: intensity_validate.yaml
