# GPU 학습 환경 (include/env.h). 추종기 값은 Nav2 설정 파일을 그대로 읽고, 지도 갱신은 Cartographer 와 같게 한다.
time:
  dt: 0.02                  # 물리 한 걸음 (limo_base control_rate 50 Hz, 섀시 오도메트리 50 Hz)
  lidar_every: 5            # 라이다 10 Hz
sensor_model: sensor_model.yaml   # 이 파일 기준. 깊이 카메라 모델(depth)을 읽음
nav2_params: ../../../../src/limo_fire/limo_fire_navigation/config/nav2_params.yaml   # 이 파일 기준. RPP·velocity_smoother·goal checker 값을 읽음
body:
  footprint: [0.32, 0.22]   # 길이·폭 (nav2 footprint)
  lidar_mount: [0.103, 0.0, 0.111]   # base_link 기준 x, y, 바닥에서 높이 (URDF laser_link, Webots)
  camera_mount: [0.15, -0.005, 0.1869] # 깊이 카메라: x·y 는 URDF camera_xyz (실물 0.15, −0.005). 높이는 실측 바닥 면 — 광축 0.1869 m
                                       # (정렬 켬 1104_R_static_aligned 맞춤, 1104_M_cmd_mecanum 확인 0.1891 — tools/depth_check). URDF 값(0.145 + 0.06 = 0.205)보다 낮음
  camera_pitch: 0.0902      # 카메라를 아래로 숙인 각 (rad, 5.2°) — 같은 바닥 면 맞춤 (mecanum 0.0936). 정렬 안 한 깊이(1103)는 0.1152 — 정렬 켬은
                            # 컬러 카메라 광축 기준이라 다름. URDF 는 수평이라 다름
  collision_band: [0.03, 0.25]       # 이 높이에 걸린 형상이 몸통과 부딪힘 (바닥 빼고)
  spawn_clearance: 0.30     # 시작 칸은 이 반경 안이 모두 빈 칸
drive:                      # 섀시 구동 (include/drive.h) — ROS 명령 경로(/cmd_vel → limo_fire_base, 정책·Nav2 가 쓰는 길).
                            # 실물 녹화로 맞춘 값: tools/motion_check --fit (사무실, 파랑 모드: 1103_M_cmd1 명령 계단 @186.3:188.2 앞 막힘 뺌,
                            # 1103_M_cmd2 세게 · 급반전 @0:4.7 명령 녹화 빠짐 뺌, 1103_M_drive3 리모컨 @부딪힌 6 s 뺌)
  delay_steps: [4, 3]       # v, ω: 명령 → 바퀴가 따라가기 시작 (dt 걸음 = 80 · 60 ms)
  tau: [0.04, 0.02]         # 빠른 갈래 1 차 시간상수 (s)
  accel: [5.0, 80.0]        # 모터 가속 한도 (m/s², rad/s²)
  slow: [0.30, 0.20]        # 느린 갈래 몫 — 명령을 받으면 목표의 70~80 % 까지 바로 튀고 나머지를 천천히
  tau_slow: [0.20, 0.20]    # 느린 갈래 시간상수 (s)
  tau_slow_down: [0.12, 0.06]   # 느린 갈래가 줄어들 때 (지금보다 작거나 반대 목표 — 멈춤·감속·반전) 시간상수 (s). 실물은 멈출 때 꼬리 없이 선다:
                            # 명령 0 → 바퀴가 직전 값의 10 % 아래 v 0.20~0.32 · ω 0.12~0.14 s (1104_M_cmd_mecanum, 지연 포함), 예전 값(0.20)으론 시뮬 0.32~0.34 · 0.20.
                            # motion_check --body --fit 의 바퀴 오차 최소는 [0.10, 0.10] 이나 v 0.10 은 예전 맞춤 1103_M_cmd2 바퀴 v R² 를 0.956 → 0.950 (기준 −0.005 넘게)
                            # 떨어뜨려 0.12 (0.952), ω 는 멈춤 시간 차가 가장 작은 0.06 (0.04~0.08 같음, 0.10 은 0.031 s 로 기준 0.03 넘음)
  max: [1.11, 3.14]         # 바퀴 최고 속도 — 끝까지 밀어 본 리모컨 녹화 99.5 % 분위. 속도 행동의 한도도 이것 (정책은 이 안에서 자유롭게)
  rc:                       # 리모컨 경로 (섀시에 바로). 리모컨 녹화를 다시 돌려 비교할 때만 씀
    delay_steps: [3, 2]
    tau: [0.02, 0.01]
    accel: [5.0, 20.0]
    slow: [0.30, 0.00]
    tau_slow: [0.06, 0.06]
    slip_w: 1.21            # 리모컨일 때만 일정하게 돌아도 바퀴 ω 가 크다 → 바닥 비에 곱함 (ROS 명령은 3 rad/s 에서도 0.99)
    rc_v: [0.000, 0.398, 0.508, 0.807, 0.666, 1.110]   # 스틱 |값| 0, 0.2 … 1 → 목표 v
    rc_w: [0.000, 0.554, 1.219, 1.550, 1.904, 2.379]
  check:                    # motion_check 통과 기준 (녹화마다)
    r2_min: 0.90            # 바퀴 v·ω 와 몸통 ω(자이로)를 이만큼 설명 — 세게 탄 녹화일수록 절대 오차가 커서 R² 로 본다
    # 몸 참값 기준 (motion_check --body, 라이다 스캔 맞추기 몸 이동 lo_* 가 있는 /cmd_vel 계단 녹화 — calibration.yaml body:).
    # 녹화를 돌리기 전에 정함 (2026-11-04). 맞춤·확인은 calibration.yaml body: (처음 제안은 mix fit 이었으나 앞뒤 단독·제자리 회전 전 범위가 든
    # mecanum 을 fit 으로 바꿈 — 맞춤을 돌리기 전). vy ≠ 0 명령 구간은 뺀다 (시뮬은 정상 메카넘 가정 — real_limo.md 구동 절)
    body_r2_min: 0.95       # 바퀴 v·ω, 몸통 ω(자이로) R² (뺀 구간 밖 줄 전부)
    body_steady_v: 0.03     # 명령이 같은 구간마다(정지 빼고) 뒤 절반 몸 vx 평균 |시뮬 − 라이다| (m/s) — 구간 하나하나가 넘으면 안 됨
    body_steady_w: 0.05     # 같은 구간 몸 ω 평균 |시뮬 − 자이로| (rad/s)
    rest_xy: 0.03           # 정지 → 정지 한 번 움직인 몸 이동 |시뮬 − 라이다| (m, 정지 때 몸 좌표 평면 거리)
    rest_yaw: 0.0524        # 같은 이동 회전 |시뮬 − 참값| (rad, 3°). 참값은 자이로 적분 — 처음엔 라이다였으나 데이터를 본 뒤 바꿈(움직이며 이은 라이다 회전이
                            # v·ω 조합에서 자이로와 최대 17 % 어긋남, real_limo.md 몸 참값 절). 수치 기준은 그대로
    stop_t90: 0.03          # 멈춤 명령 → 바퀴 속도가 직전 값의 10 % 아래로 떨어지는 시간 |시뮬 − 실물| 평균 (s, v·ω 따로)
    keep_r2: 0.005          # 예전 맞춤 녹화(recordings: 1103_*)의 바퀴 v·ω·자이로 R² 가 바꾸기 전보다 이만큼 넘게 떨어지면 안 됨
floors:                     # 바닥 재질 (drive.h Floor): 일정할 때 바퀴 / 몸통 비, 몸통 가속 한도(마찰), 몸통 1 차 지연. 각 [최소, 최대] —
                            # 판마다 무게대로 하나 뽑고 범위 안에서 고르게. 세게 가속하면 바퀴가 헛돈다(바퀴 ω / 자이로 가속 중 1.1~1.4).
                            # motion_check --fit 이 실물 바퀴 ω → 자이로로 맞춘다 (같은 바닥의 ROS 명령 녹화)
  - name: office            # 사무실 바닥 — 실물 바퀴로 자이로 RMSE 0.055 rad/s
    weight: 1.0
    slip: [[1.0, 1.0], [1.02, 1.04]]        # [v, ω] — 일정할 때 직진 비는 아직 못 잼 (IMU 로는 안 보임, 라이다로)
    traction: [[4.2, 4.8], [25, 35]]        # 몸통 가속 한도 [v m/s², ω rad/s²] — motion_check --set fit: v 4.5 (IMU 가속도, 바퀴는 6~9 까지), ω 30
    lag: [[0, 0], [0, 0]]                   # 몸통이 바퀴를 따라가는 1 차 지연 [v, ω] (s)
  - name: lab               # 실험실 반들한 바닥 (1104 녹화) — motion_check --set analysis/calibration.yaml fit --body --fit (1104_M_cmd_mecanum, 옆 명령 뺌)
    weight: 1.0
    slip: [[0.99, 1.01], [0.985, 1.005]]    # 직진: 앞뒤 단독 정지→정지 바퀴 적분 / 라이다 1.000 (구간마다 0.95~1.02), 회전: 실물 바퀴 ω → 자이로 0.995
    traction: [[4.2, 4.8], [40, 60]]        # 회전 가속 한도 50 (실물 바퀴 ω → 자이로 RMSE 0.073 rad/s). 직진은 안 잼 — 사무실 값 그대로 (잠정)
    lag: [[0, 0], [0, 0]]
  - name: unmeasured        # 아직 안 잰 바닥(시연장 등) 대비 — 실측 아님, 넓게 흔듦. 재면 그 바닥으로 바꾼다
    weight: 1.0
    slip: [[0.97, 1.05], [0.98, 1.15]]
    traction: [[2, 20], [8, 60]]
    lag: [[0, 0.05], [0, 0.05]]
imu:                        # 자이로 z 측정 (관측 숫자). 실측 정지 σ 0.0009 rad/s · 바이어스 −1.3e−4 (analysis/real_limo.md) — 주행 진동 몫으로 넉넉히
  gyro_sigma: 0.003         # 걸음(50 Hz)마다 잡음 (rad/s)
  gyro_bias: 0.0005         # 판마다 ± 이 안에서 고른 바이어스 (rad/s)
map:                        # Cartographer (cartographer_2d.lua + 기본값)
  resolution: 0.05
  size: 512                 # 환경마다 512 × 512 칸 (25.6 m). 4 의 배수. AWS 작은 집 25 m · 계획 최대 맵(시연장 1~3 배)까지
  hit: 0.55                 # 확률 → 로그 오즈 × 1000 으로 저장
  miss: 0.49
  clamp: [0.1, 0.9]
  max_range: 8.0            # TRAJECTORY_BUILDER_2D.max_range
  missing_ray: 0.1          # missing_data_ray_length
pose_error:                 # 지도에 쓰는 자세의 오차 (OU). 잠정: 실물 map→odom 보정이 녹화 전체 0.07 m · 0.05 rad
  sigma_xy: 0.03
  sigma_yaw: 0.017
  tau: 5.0
  # 관측 "지도 속도"용 후보 모델 (include/pose_error.h) — 학습 환경은 아직 안 쓴다 (mdp/README 📏). tools/mapvel_check 가 읽어 실물과 비교.
  # 맞춤 spot1·spot2·cmd2·drive3 → 확인 spot3·cmd1·drive1 에서 15 항목 중 9 통과: 움직일 때 σ·자기상관은 대체로 맞지만 큰 잔차 비율이
  # 실물보다 1.3~1.9 배(실물은 꼬리가 두꺼움), 그리고 이 값이면 지도 자세 오차 RMS 가 0.04 m · 0.2 rad 로 실물 지도보다 커서 지도가 망가짐.
  # 실물 잔차는 0.1 s 자기상관 0.4~0.5 인데 0.2 s 는 ≈ 0 — 보정 계단 + 짧게 이어지는 몫(바퀴 헛돎·EKF 늦음 추정)을 같이 담을 모델이 필요
  mapvel_model:
    p: [0.9308, 0.2993]     # 물리 걸음마다 map → odom 보정 확률 [움직임, 정지] — 실측 map → odom 이 바뀐 줄 비율
    drift: [0.150, 0.800, 0.350, 0.650]   # [표류 상관 시간 s, 앞·옆·yaw 표류 몫] — 실측 잔차 0.1 s 자기상관(0.54 · 0.12 · 0.38)을 시뮬 격자로
    noise:                  # [정지 σ, 움직일 때 분산 q1, qv, qw] (앞 m · 옆 m · yaw rad). 움직일 때 잔차가 속도와 거의 무관해 q1 만
      fwd: [0.00089, 5.3918e-05, 0.0, 0.0]
      side: [0.00060, 1.7169e-05, 0.0, 0.0]
      yaw: [0.00596, 1.1394e-03, 0.0, 0.0]
    tau: 5.0                # 오차가 0 으로 돌아가는 시간 (s) — 잠정 (0.3·1 s 도 해 봤지만 맞춤 녹화에서 더 넘음)
action:
  mode: velocity            # velocity: 정책이 (v, ω) 를 그대로 /cmd_vel 로. goal: 로봇 기준 목표점 → Nav2 RPP 식 추종
  velocity:
    period: 0.1             # 행동 하나 (s) = 라이다 한 장. (v, vy, ω) 한도·바퀴 자르기는 mdp/obs_layout.h mdp::act
  goal:
    period: 0.5
    n_dir: 16               # 로봇 기준 방향 16 × 거리
    dist: [0.5, 1.0, 2.0]
    goal_margin: 0.25       # 막힌 칸 이만큼 앞에서 목표점을 자름
  graph:                    # 그래프 모드 (mdp/graph.h, mdp/README "그래프 모드") — 계층형(path) 위에 얹음: 정책이 현재 노드의 이웃 노드 하나를 고름. 학습기·도구가 --graph 로 켬
    standable: true         # 노드·간선이 지나는 칸: true = 로봇이 설 수 있는 칸(mdp::standable) · false = 빈 칸(전작 node_manager.py check_collision 그대로).
                            # 미리 정한 규칙(규칙 정책 graph_guide 성공률 두 시험 맵 평균이 높은 쪽, 차이 0.02 안이면 빈 칸)으로 고름: 512 판씩 빈 칸 0.031 · 설 수 있는 칸 0.057 (mdp/README "그래프 모드")
    utility_range_ratio: 0.8   # 유틸리티 범위 = 이 값 × map.max_range (전작 parameter.py UTILITY_RANGE = 0.8 * SENSOR_RANGE)
    min_utility: 2          # 보이는 프론티어 복셀이 이 수 이하면 유틸리티 0 (전작 MIN_UTILITY)
    blocking_only: true     # 유틸리티가 세는 프론티어 칸 = 닫힘(성공 판정)을 막는 칸만 (mdp/frontier.h n_block: 설 수 있는 칸으로 닿음 · close_min 칸 이상 덩어리 · 본 칸 아님)
                            # → 유틸리티가 모두 0 ≈ 지도 닫힘 (전작의 판 끝 = 유틸리티 합 0 과 같은 뜻). false = 모든 프론티어 칸 (전작 그대로 — 벽 틈·못 닿는 곳도 셈, 측정은 mdp/README)
    frontier_cell: 0.4      # 프론티어 복셀 변 (m) — 전작 parameter.py 와 같은 비율: FRONTIER_CELL_SIZE 0.8 m / SENSOR_RANGE 16 m = 1/20 → map.max_range 8 m × 1/20
    # --- 2026-11-11 전작 방식 (mdp/README "그래프 모드 — 전작 방식") ---
    node_resolution: 0.8    # 노드 간격 (m) — map.resolution 의 배수, × 32 칸이 지도를 덮어야 함. 0.8 · 1.2 · 2.0 m 를 같은 조건으로 재서 고름 (표는 mdp/README "그래프 모드 — 전작 방식":
                            # 규칙 정책 성공률 0.8 ≈ 1.2 > 2.0, 그래프 끊김 0.8 이 가장 작음). 논문 실물(V-C) 센서 8 m · Δnode 0.8 m(건물·정원) · 2 m(캠퍼스), Gazebo 1.2 ~ 2.8 m, 학습 시뮬 4 m(센서 20 m)
    termination: ariadne    # 판 끝·보상: ariadne = 전작 worker.py:53-59·env.py:72-88 (끝 = 유틸리티 합 0 · 충돌 · 최대 길이, 보상 = −거리/사거리 + 사라진 프론티어/정규화 + 끝 20)
                            #            hier = 계층형 규칙·보상 그대로 (닫힘 성공·진행 없음 60 s — 규칙 정책을 slot0 과 같은 성공 정의로 잴 때)
    decision: node          # 결정 길이: node = 한 결정에 한 노드(고른 이웃에 닿을 때까지 — 논문 학습 시뮬·전작 env.step 방식) · period = 고정 주기 path.period 1 s(논문 실물 V-C 의 1 Hz 재계획, 닿아도 안 멈춤).
                            # 둘 다 재서 규칙 정책 성공률이 높은 쪽(node)을 기본으로 (표는 mdp/README)
    decision_timeout: 15.0  # decision: node 일 때 결정 하나의 시간 상한 (s) — 잠정 (전작엔 없음: 격자 세계라 한 걸음에 늘 닿음). 측정한 결정당 평균은 2.0 ~ 2.3 s (0.8 m)
    max_decisions: 0        # 판의 결정 수 상한 (0 = 안전 시간 1200 s 만). 전작 MAX_EPISODE_STEP 128 (parameter.py:31) · HEADER 200 (§IV) — 간격·맵 크기가 달라 그대로 못 가져와 꺼 둠
    pass_through: true      # 추종기가 경로 끝(= 다음 노드)에서 감속하지 않음 — 닿으면 바로 다음 결정 (전작·논문: 웨이포인트를 1 Hz 로 갈아 줌, 노드에서 서지 않음)
    reward_dist_scale: 1.0  # 거리 벌점 = 이동 거리 (m) × 이 값 / map.max_range (전작 env.py:82 dist / UPDATING_MAP_SIZE × 5 = dist / 16 m = dist / SENSOR_RANGE)
    reward_done: 20.0       # 유틸리티 합 0 으로 끝난 판의 끝 보상 (전작 worker.py:58)
    visited_utility: 0      # 방문한 노드의 유틸리티 — 0 = 전작 그대로(방문 노드 0, node_manager.py:287-290 set_visited). 아래 둘은 우리 수정 (논문·전작에 없음, 라이다 전방 220° 라
                            # 지나가도 안 본 방향이 남는 것 때문 — 측정은 mdp/README): 1 = 현재 노드만 0 · 2 = 유틸리티 노드가 하나도 없는데 프론티어 복셀이 남았으면 방문 표시를 지우고 다시 셈
    leftover_utility: 1     # 남은 프론티어 맡기기 — **논문·전작에 없는 우리 수정** (mdp/graph.h 6b, 측정은 mdp/README "유틸리티 합 0 ⇔ 지도 닫힘"): 유틸리티 노드가 하나도 없는데
                            # 닫힘을 막는 프론티어 복셀이 남았으면 복셀마다 (그 복셀을 보는 · 가장 가까운) 노드 하나에 유틸리티 1 → 유틸리티 합 0 ⇔ 지도 닫힘.
                            # 0 = 끔(전작 그대로) · 1 = 켬 · 2 = 켬 + 안 가 본 노드 먼저 (2 는 안 잼). 켜면 전작 판 끝(유틸리티 합 0)은 지도가 닫혔을 때만 판을 끝냄 (graph_env.h)
  path:                     # 계층형 (include/hier_path.h): 정책이 결정마다 프론티어 후보 하나 → 로봇 지도 경로 + Nav2 RPP 식 추종. 학습기·도구가 --hier 로 켬
    period: 1.0             # 결정 하나 (s) = 속도 행동 주기 0.1 s × 10 걸음 묶음
    candidates_v2: false    # 후보 v2 (mdp/README "계층형 후보 v2"): 조각 합치기 · 큰 덩어리 자리 3 · 예상 관측량 특징. 관측 크기는 같고 F_SIZE·F_UTIL 뜻과 후보 차례가 바뀜 —
                            # 기존 후보로 학습한 가중치와 섞어 쓰지 말 것. false = 기존 후보 그대로(비트 같음). SIM_CAND_V2=1 로도 켬
    v: 1.0                  # RPP desired_linear_vel = velocity_smoother 최고 속도 — 기준선 fast 판과 같은 1 m/s (LIMO 데이터시트 최고 속도, mdp/README 행동 표)
    use_cost_regulated_linear_velocity_scaling: true   # 기준선 fast 판과 같게: 1 m/s 에선 장애물 근접 감속이 있어야 벽에 안 닿음 (baselines/frontier/config/frontier.yaml modes.fast)
    cost_scaling_dist: 0.6  # Nav2 RPP 기본값 (regulated_pure_pursuit_controller.cpp:97-100, 우리 nav2_params 에 없음 — 기준선과 같은 값)
    cost_scaling_gain: 1.0
    backup_speed: 0.05      # RPP 충돌 검사(nav2_params max_allowed_time_to_collision_up_to_carrot)에 걸리면 물러나는 속도 — Nav2 BT BackUp 과 같은 값 (frontier.yaml nav2.backup_speed)
    extra_padding: 0.0      # 충돌 검사 발자국을 nav2 footprint_padding(0.02) 위에 더 넓힘 (m). 0.03 → 0 (2026-11-10): 0.03 은 시험 맵 충돌을 줄이려던 잠정 값인데
                            # 그 충돌의 98 % 는 라이다가 못 보는 물체(깊이 카메라 층이 맡음). 계획 반경이 발자국을 따라 커지므로(consistent_plan) 0.03 이면 0.335 m 라
                            # 통로가 막힘 — hier_cf 256 판(RL, 서점): 0.03 참성공 0.625 · 0 0.707, 학습 맵 단계 2·3 성공 0.586 · 0.652
    weight_mid_dist: 0.3   # 경로 무게 경계 (m, 막힘까지): ≤ 0.3 → 3, ≤ 팽창 반경(nav2 inflation_radius 0.45) → 2, 밖 → 1 — 잠정 (hier_path.h 머리말 근거)
    # 사람·움직이는 장애물 피하기 (hier_path.h "지금 스캔", 2026-11-09). 정답 사람 자리는 안 쓰고 지금 라이다 장만. SIM_HIER_AVOID=0 이면 둘 다 끔(옛 동작)
    scan_obstacles: all     # 경로 계획 때 지금 스캔 끝점(nav2_params global obstacle_layer obstacle_max_range 3 m 안)을 막힘으로 — Nav2 ObstacleLayer marking
                            # (obstacle_layer.cpp updateBounds: 범위 안 점 → LETHAL_OBSTACLE) 과 같은 뜻, 팽창은 지도 막힘과 같은 로봇 반경·무게 경계.
                            # off · map_free(지도가 빈 칸으로 아는 칸에 맞은 점만 — 움직이는 물체) · all(모든 점, Nav2 그대로). 고른 근거: hier_path.h path_scan_cell
    collision_monitor:      # Nav2 collision_monitor FootprintApproach (추종기 → velocity_smoother 뒤, 추종기 앞 범퍼 정지 앞)
      enabled: true
      time_before_collision: 2.0   # Nav2 humble collision_monitor_params.yaml FootprintApproach 값 = 소스 기본 (polygon.cpp)
      simulation_time_step: 0.1    # 같은 출처
      max_points: 5                # 같은 출처 (humble 규칙: 발자국 안 점 수 > max_points 면 걸림). 우리 스캔은 248 각도 칸 — 칸 하나 = 점 하나
    # 계획·충돌 검사 일치 (hier_path.h "계획·충돌 검사 일치", 2026-11-10): 계획 반경 = 충돌 검사 발자국(footprint + 패딩) 외접 반경 + 칸 대각 → 계획한 경로 위
    # 자세는 (어느 방향이든) 충돌 검사를 통과. 목표가 그 반경으로 설 수 없으면 nav2_params GridBased tolerance(0.25 m) 안 칸으로. 끄면 f0b48eb 와 같음
    consistent_plan: true
    # 목표 허용 (hier_path.h "목표 허용"): 후보 칸(로봇 지도 0.2 m 반경 기준)이 계획 반경·깊이 카메라 층 때문에 설 수 없으면 Smac tolerance(0.25 m) 안 칸,
    # 그것도 못 닿으면 BFS 끝에 이 거리 안 닿은 칸 중 목표에 가장 가까운 칸으로 — 잠정 (도착하면 제자리 회전으로 라이다가 후보를 봄)
    goal_far_tolerance: 1.0
    # 아래층 단독 과제 (include/low_task.h, scripts/low_run — mdp/README "아래층 계측·단독 과제"). 모드 자체는 도구가 켠다(기본 꺼짐 — 끄면 기존과 비트 같음).
    # 값은 모두 잠정 (아래층 RL 설계 문서 3 절에서 그대로 — 측정 근거 없음)
    follow:
      pass_radius: 0.5      # 목표 칸까지 이 거리 안이면 통과로 치고 다음 목표 (m, 지도 자세 기준)
      stall_time: 10.0      # 정체: 이 시간 동안 (s)
      stall_dist: 0.3       #   이 거리를 못 벗어나면 판 끝 (m, 참 자세)
      time_limit: 60.0      # 과제 구간 시간 상한 (s)
      max_goals: 5          # 목표 이 개수를 지나면 판 끝
      front_fov_deg: 220    # 사람 충돌을 앞·뒤로 나누는 앞 시야 (라이다 fov 220° — sensor_model.yaml)
    # 복구 (hier_path.h "복구", 2026-11-10): 같은 목표에서 RPP 충돌 검사가 결정(1 s)의 절반 넘게 멈춤·물러남인 결정이 이어지면 Nav2 BT
    # (navigate_to_pose_w_replanning_and_recovery.xml) 꼴로 1·2 번째 다시 계획 → 3 번째 BackUp → 4 번째 그 목표 포기. 끄면 f0b48eb 와 같음
    recovery:
      enabled: true
      backup_dist: 0.30         # BT BackUp backup_dist (backup_speed 는 위 backup_speed 0.05 — BT 와 같은 값) → 6 s
      blacklist_time: 10.0      # 포기한 목표 둘레 후보를 안 가는 시간 (s) — 잠정
      same_goal_radius: 0.5     # 이 거리 안 목표 칸은 같은 목표 (m) — 잠정 (후보 칸은 프론티어가 줄며 조금씩 옮김)
    # 깊이 카메라 장애물 층 (hier_path.h "깊이 카메라 장애물 층", 2026-11-10): 라이다 면(0.111 m) 밖 낮은 물체·가구 윗판을 깊이 영상(정책 입력과 같은 40 × 64
    # 바이트)으로 — Nav2 VoxelLayer (voxel_layer.cpp: 띠 안 점만 지우기 광선·표시, mark_threshold 0 = 높이 칸 하나라도 켜지면 LETHAL). 로봇 지도와 따로라
    # 정책 관측·닫힘·프론티어는 그대로, 경로 계획·RPP 충돌 검사·근접 감속·collision_monitor 만 본다. 끄면(enabled false · 절 없음) f0b48eb 와 같음
    camera_obstacles:
      enabled: true
      min_obstacle_height: 0.03    # = body.collision_band 아래 끝 (몸통에 걸리는 가장 낮은 높이). Nav2 문서: 깊이 센서는 바닥 점이 안 남게 0 보다 조금 위 — 잠정
      max_obstacle_height: 0.25    # = body.collision_band 위 끝 (몸통 높이 — 그 위는 몸통에 안 닿음)
      z_voxels: 8                  # 높이 칸 수 (띠 0.22 m / 8 = 2.75 cm). Nav2 z_voxels ≤ 16 — 잠정 (우리 칸 하나 = 1 바이트)
      obstacle_max_range: 2.5      # 표시 거리 (센서에서 수평 m) — Nav2 ObstacleLayer·VoxelLayer obstacle_max_range 기본값
      raytrace_max_range: 3.0      # 지우기 광선 거리 — Nav2 raytrace_max_range 기본값 (= 관측 깊이 obs_max 3 m)
# 보상·판 끝(안전 시간)·관측 크기는 코드 안: mdp/rewards.h · mdp/curriculums.h · mdp/obs_layout.h (mdp/README)
curriculum:                 # 단계 오르내림 (mdp/curriculums.h). 단계(맵 넓이·오차 배율·사람 수)는 코드 안 kStages. 맨 위 단계 무작위는 SIM_CUR_TOPRAND (기본 켬)
  rule: success             # 최근 window 판 성공(지도 닫힘) 비율 — 하나뿐 (옛 coverage 규칙은 정답 벽 덮음이라 2026-11-14 에 없앰)
  success:                  # 미끄러지는 창 (판마다 봄, 단계가 바뀌면 창 비움). 근거: mdp/README "커리큘럼" (2026-11-09 oracle 상한 측정)
    window: 24              # 창 판 수 (≤ 32) — 잠정 (SGN-CIRL arXiv 2506.04505 은 30 판·85 %)
    up: 0.80                # 올림: 정답 허용 상한(scripts/oracle_run)이 단계 1~3 에서 0.83~0.93 이라 0.9 는 못 넘는 단계가 있음.
                            # NavRL arXiv 2409.15634 "once the navigation success rate exceeds 80%" 와 같은 값
    down: 0.50              # 내림 — 잠정 (legged_gym 이 요구 거리 절반 아래면 내리는 "절반" 자리, 성공률 출처 없음)
people:                     # 움직이는 사람 (include/people.h). 사람 수는 여기 없다 — 환경마다 판 시작 인자(Env::set_people_max, 커리큘럼)
  radius: [0.20, 0.30]      # 원기둥 반지름 (m) — 잠정 (어깨 폭 절반·팔 흔들림 몫, 판마다 사람마다 고르게)
  height: [1.60, 1.80]      # 키 (m) — 잠정. 라이다(0.11 m)·깊이(0.21 m)보다 높기만 하면 센서 값은 같다
  speed: [0.0, 1.3]         # 걷는 사람 속도 고르게 (m/s). 위 끝 = 건강한 성인 평소 걸음 1.31 m/s 메타분석, 실내 보행 0.8~1.0 사례 (mdp/README "움직이는 사람")
  p_stand: 0.3              # 서 있기만 하는 사람 비율 — 잠정
  p_ignore: 0.5             # 로봇을 무시하고 걷는 사람 비율 — 잠정 (정책이 피해야만 하게)
  p_approach: 0.0           # 걷는 사람 중 로봇 자리로 다가오는 비율 (1 s 마다 목표를 로봇으로 — people.h) — 기본 0 = 옛 동작
  p_cross: 0.0              # 걷는 사람 중 로봇 앞 예측 길(1 ~ 3 m)을 가로지르는 비율 — 기본 0
  yield_dist: 1.0           # 나머지는 로봇 중심이 이 안이면 비켜섬 (m) — 잠정
  yield_speed: 0.5          # 비켜서는 속도 (m/s) — 잠정
  spawn_keep: 1.5           # 로봇 출발점에서 이 안엔 안 놓음 (m)
  pause: 3.0                # 목표점에 닿으면 0 ~ 이 시간 섬 (s) — 잠정
